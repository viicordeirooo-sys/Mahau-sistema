<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahau · Sistema Financeiro</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;font-size:13px;display:flex;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#0d1117}::-webkit-scrollbar-thumb{background:#2d333b;border-radius:3px}
input,select,button{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* SIDEBAR */
#sb{width:200px;background:#161b22;border-right:1px solid #21262d;display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:18px 16px;border-bottom:1px solid #21262d}
.sb-sys{font-size:9px;color:#484f58;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sb-dot{width:7px;height:7px;border-radius:1px;background:#2563eb;display:inline-block}
.sb-name{font-size:17px;font-weight:800;letter-spacing:-.5px}
.sb-date{font-size:10px;color:#484f58;margin-top:2px}
nav{padding:8px 0;flex:1}
.nb{display:flex;align-items:center;gap:9px;padding:10px 16px;width:100%;background:none;border:none;border-left:2px solid transparent;color:#8b949e;cursor:pointer;font-size:12px;font-weight:400;text-align:left;transition:all .1s}
.nb.on{background:#1c2332;border-left-color:#2563eb;color:#e6edf3;font-weight:600}
.nb svg{width:15px;height:15px;flex-shrink:0}
.sb-sum{padding:14px 16px;border-top:1px solid #21262d}
.ss-t{font-size:9px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.ss-r{display:flex;justify-content:space-between;margin-bottom:5px}
.ss-l{font-size:10px;color:#484f58}
.ss-v{font-size:10px;font-weight:600;font-family:'Courier New',monospace}

/* MAIN */
#main{flex:1;overflow:auto;padding:24px;background:#0d1117}
.page{display:none}.page.on{display:block}
.eyebrow{font-size:11px;color:#3b82f6;font-weight:600;letter-spacing:.8px;margin-bottom:4px}
.pg-t{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:20px}
.pg-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.pg-h .pg-t{margin-bottom:0}

/* KPIS */
.kpis{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.kpi{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:16px 18px;flex:1;min-width:150px}
.kpi-l{font-size:10px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.kpi-v{font-size:20px;font-weight:700;font-family:'Courier New',monospace}
.kpi-s{font-size:10px;color:#484f58;margin-top:4px}

/* BOX/TABLE */
.box{background:#161b22;border:1px solid #21262d;border-radius:8px;overflow:hidden;margin-bottom:14px}
.bh{padding:10px 14px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center;background:#1c2332}
.bt{font-size:11px;color:#8b949e;font-weight:600}
.bb{padding:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
th{padding:8px 12px;text-align:left;color:#484f58;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;border-bottom:1px solid #21262d;white-space:nowrap}
th.r{text-align:right}
td{padding:10px 12px;border-bottom:1px solid #1c2332;font-size:12px;color:#e6edf3}
td.r{text-align:right}td.mn{font-family:'Courier New',monospace}td.mt{color:#484f58}
tr:hover td{background:#1a2030}
.tr-tot td{background:#1c2332;font-weight:700}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;font-family:'Courier New',monospace;white-space:nowrap}

/* FORM */
.fb{background:#161b22;border:1px solid #2d333b;border-radius:8px;padding:20px;margin-bottom:14px}
.ft{font-weight:600;font-size:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.fg{display:grid;gap:10px;margin-bottom:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:10px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.fi input,.fi select{background:#1c2332;border:1px solid #2d333b;border-radius:5px;padding:8px 10px;color:#e6edf3;font-size:12px;outline:none;width:100%;font-family:'Courier New',monospace;transition:border-color .15s}
.fi input:focus,.fi select:focus{border-color:#2563eb}
.slbl{font-size:10px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin:8px 0}

/* BUTTONS */
.btn{border:none;border-radius:5px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:background .15s}
.bp{background:#2563eb;color:#fff}.bp:hover{background:#3b82f6}
.bg_{background:transparent;color:#8b949e;border:1px solid #2d333b}.bg_:hover{color:#e6edf3}
.bd_{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.bsm{padding:4px 10px;font-size:10px}
.bi{background:none;border:none;color:#484f58;cursor:pointer;padding:2px 5px;font-size:16px;line-height:1}
.bi:hover{color:#8b949e}

/* MISC */
.ctr{display:flex;align-items:center;gap:10px}
.cb{background:#1c2332;border:1px solid #2d333b;color:#e6edf3;border-radius:5px;width:30px;height:30px;cursor:pointer;font-size:16px;font-weight:700}
.cv{font-family:'Courier New',monospace;font-size:24px;font-weight:700}
.br-row{margin-bottom:10px}
.br-m{display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px}
.br-t{background:#1c2332;border-radius:3px;height:5px;overflow:hidden}
.br-f{height:5px;border-radius:3px}
.prog{background:#1c2332;border-radius:3px;height:4px;overflow:hidden;width:50px;display:inline-block;vertical-align:middle;margin-right:6px}
.pf{height:4px;background:#2563eb;border-radius:3px}
.ec{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.ec:hover,.ec.on{border-color:#2563eb;background:#1c2332}
.ech{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.dre-box{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:16px}
.dre-r{display:flex;justify-content:space-between;padding:3px 0;font-size:11px}
.dre-r.bold{font-weight:700}.dre-r.big{padding-top:10px}
.dre-sep{border-top:1px solid #21262d;margin:8px 0}
.pills{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{background:transparent;color:#484f58;border:1px solid #21262d;border-radius:20px;padding:4px 12px;font-size:10px;font-weight:600;cursor:pointer}
.pill.on{background:#2563eb;color:#fff;border-color:#2563eb}
.wb{background:#161b22;border:1px solid #21262d;border-radius:8px;margin-bottom:12px;overflow:hidden}
.wh{display:flex;justify-content:space-between;padding:10px 14px;background:#1c2332;border-bottom:1px solid #21262d}
.eq-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eq-c{background:#1c2332;border-radius:6px;padding:12px 16px;flex:1;min-width:120px;border-left:3px solid #2563eb}
.eq-l{font-size:9px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
.eq-v{font-family:'Courier New',monospace;font-size:15px;font-weight:700}
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g2c{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.sw{position:relative;flex:1;min-width:200px}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#484f58;pointer-events:none;font-size:12px}
.si-inp{background:#161b22;border:1px solid #21262d;border-radius:5px;padding:8px 10px 8px 30px;color:#e6edf3;font-size:12px;outline:none;width:100%;font-family:'Courier New',monospace}
.sbs{display:flex;gap:6px}
.sb2{background:transparent;color:#484f58;border:1px solid #2d333b;border-radius:5px;padding:7px 12px;font-size:10px;font-weight:600;cursor:pointer}
.sb2.on{background:#2563eb;color:#fff;border-color:#2563eb}
.flt{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.hidden{display:none!important}
.empty{text-align:center;padding:40px;color:#484f58}
.green{color:#22c55e}.red{color:#ef4444}.amber{color:#f59e0b}
</style>
</head>
<body>

<div id="sb">
  <div class="sb-logo">
    <div class="sb-sys"><span class="sb-dot"></span>SISTEMA FINANCEIRO</div>
    <div class="sb-name">Mahau Balada</div>
    <div class="sb-date" id="sb-date"></div>
  </div>
  <nav id="nav"></nav>
  <div class="sb-sum">
    <div class="ss-t">Resumo do Mês</div>
    <div class="ss-r"><span class="ss-l">Faturamento</span><span class="ss-v" id="ss-fat">—</span></div>
    <div class="ss-r"><span class="ss-l">CMV Médio</span><span class="ss-v" id="ss-cmv">—</span></div>
    <div class="ss-r"><span class="ss-l">Resultado</span><span class="ss-v" id="ss-res">—</span></div>
    <div class="ss-r"><span class="ss-l">Rateio/Noite</span><span class="ss-v" id="ss-rat">—</span></div>
  </div>
</div>

<div id="main">
  <div id="p-dash" class="page on"></div>
  <div id="p-card" class="page"></div>
  <div id="p-eventos" class="page"></div>
  <div id="p-compras" class="page"></div>
  <div id="p-custos" class="page"></div>
  <div id="p-estoque" class="page"></div>
</div>

<script>
// ── FIREBASE ──────────────────────────────────────────────────────────────────
let db = null;
try {
  firebase.initializeApp({
    apiKey:"AIzaSyA_lHzWt7pKHbebbRmhSakMwZwfVa7fUKI",
    authDomain:"mahau-sistema.firebaseapp.com",
    projectId:"mahau-sistema",
    storageBucket:"mahau-sistema.firebasestorage.app",
    messagingSenderId:"748350373228",
    appId:"1:748350373228:web:cbbd080ce643f8308a0749"
  });
  db = firebase.firestore();
} catch(e) { console.warn('Firebase init:', e.message); }

// ── STATE ─────────────────────────────────────────────────────────────────────
const S = {
  page:'dash', evSel:null, cardCat:'Todos', cardSort:'nome',
  eventos:[], custos:[], compras:[],
  config:{datasNoMes:4, estoqueInicial:0}
};

// ── FORMATTERS ────────────────────────────────────────────────────────────────
const R  = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const Rf = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const P  = v => `${((v||0)*100).toFixed(1)}%`;
const chip = (txt, color) => `<span class="badge" style="background:${color}18;color:${color}">${txt}</span>`;
const cCmv = p => p>0.30?'#ef4444':p>0.28?'#f59e0b':'#22c55e';

// ── FIREBASE OPS ──────────────────────────────────────────────────────────────
const FS = {
  save: async (col, data) => {
    if (!db) return alert('Firebase não conectado. Abra pelo link do Vercel.');
    if (data.id) await db.collection(col).doc(String(data.id)).set(data);
    else { const r = await db.collection(col).add(data); await r.update({id:r.id}); }
  },
  del:    (col, id)     => db ? db.collection(col).doc(String(id)).delete() : null,
  setDoc: (col, id, d)  => db ? db.collection(col).doc(id).set(d, {merge:true}) : null,
  listen: (col, cb)     => { if(db) db.collection(col).onSnapshot(s => cb(s.docs.map(d=>d.data()))); },
  listenDoc: (col,id,cb)=> { if(db) db.collection(col).doc(id).onSnapshot(s=> cb(s.exists?s.data():null)); },
};

// ── CALCS ─────────────────────────────────────────────────────────────────────
const totalFixo    = () => S.custos.reduce((s,c)=>s+(c.valor||0),0);
const totalCompras = () => S.compras.reduce((s,c)=>s+(c.total||0),0);
const rateio       = () => S.config.datasNoMes>0 ? totalFixo()/S.config.datasNoMes : 0;

function calcEv(e) {
  const rec=(e.bar||0)+(e.entrada||0);
  const cmv=Math.max(0,(e.compras||0)-(e.sobras||0));
  const dir=(e.dj||0)+(e.seguranca||0)+(e.staff||0)+(e.outros||0);
  const vip=e.vip_custo||0, des=e.desperdicio||0;
  const res=rec-cmv-vip-des-dir-rateio();
  return {rec,cmv,cmvP:rec?cmv/rec:0,vipP:rec?vip/rec:0,desP:rec?des/rec:0,dir,res,mg:rec?res/rec:0};
}

// ── NAV ───────────────────────────────────────────────────────────────────────
const PAGES = [
  {id:'dash',    label:'Dashboard'},
  {id:'card',    label:'Cardápio'},
  {id:'eventos', label:'Eventos'},
  {id:'compras', label:'Compras'},
  {id:'custos',  label:'Custos Fixos'},
  {id:'estoque', label:'Estoque / CMV'},
];

function initNav() {
  document.getElementById('nav').innerHTML = PAGES.map(p=>`
    <button class="nb${S.page===p.id?' on':''}" onclick="go('${p.id}')">${p.label}</button>
  `).join('');
  document.getElementById('sb-date').textContent =
    new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
}

function go(id) {
  S.page = id;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  document.querySelectorAll('.nb').forEach(b=>{
    b.classList.toggle('on', b.textContent===PAGES.find(p=>p.id===id)?.label);
  });
  render();
}

// ── SIDEBAR SUMMARY ───────────────────────────────────────────────────────────
function renderSidebar() {
  const calcs = S.eventos.map(e=>({...e,...calcEv(e)}));
  const tRec=calcs.reduce((s,e)=>s+e.rec,0);
  const tRes=calcs.reduce((s,e)=>s+e.res,0);
  const cmvP=tRec?calcs.reduce((s,e)=>s+e.cmv,0)/tRec:0;
  document.getElementById('ss-fat').textContent = tRec?R(tRec):'—';
  const cmvEl = document.getElementById('ss-cmv');
  cmvEl.textContent = tRec?P(cmvP):'—';
  cmvEl.className = 'ss-v '+(cmvP>0.28?'amber':tRec?'green':'');
  const resEl = document.getElementById('ss-res');
  resEl.textContent = tRec?R(tRes):'—';
  resEl.className = 'ss-v '+(tRes>0?'green':'red');
  document.getElementById('ss-rat').textContent = R(rateio());
}

// ── RENDER ROUTER ─────────────────────────────────────────────────────────────
function render() {
  renderSidebar();
  const p = S.page;
  if(p==='dash')    renderDash();
  if(p==='card')    renderCard();
  if(p==='eventos') renderEventos();
  if(p==='compras') renderCompras();
  if(p==='custos')  renderCustos();
  if(p==='estoque') renderEstoque();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function el(id) { return document.getElementById(id); }
function set(id, html) { const e=el(id); if(e) e.innerHTML=html; }
function nv(id) { return parseFloat(el(id)?.value)||0; }
function sv(id) { return el(id)?.value||''; }
function barRow(label, value, max, color) {
  return `<div class="br-row">
    <div class="br-m"><span style="color:${color};font-weight:500">${label}</span>
    <span style="font-family:'Courier New';font-weight:600;color:${color}">${R(value)}</span></div>
    <div class="br-t"><div class="br-f" style="width:${max?(value/max*100).toFixed(1):0}%;background:${color}"></div></div>
  </div>`;
}
function kpiHTML(title, value, sub, color, accent) {
  return `<div class="kpi" style="border-top:2px solid ${accent||'#21262d'}">
    <div class="kpi-l">${title}</div>
    <div class="kpi-v" style="color:${color||'#e6edf3'}">${value}</div>
    ${sub?`<div class="kpi-s">${sub}</div>`:''}
  </div>`;
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDash() {
  const calcs = S.eventos.map(e=>({...e,...calcEv(e)}));
  const tRec=calcs.reduce((s,e)=>s+e.rec,0);
  const tCmv=calcs.reduce((s,e)=>s+e.cmv,0);
  const tRes=calcs.reduce((s,e)=>s+e.res,0);
  const tVip=calcs.reduce((s,e)=>s+(e.vip_custo||0),0);
  const cmvP=tRec?tCmv/tRec:0;

  const canais=[
    {n:'Bar',    v:calcs.reduce((s,e)=>s+(e.bar||0),0),    c:'#2563eb'},
    {n:'Entrada',v:calcs.reduce((s,e)=>s+(e.entrada||0),0),c:'#10b981'},
  ];
  const maxC = Math.max(...canais.map(c=>c.v),1);

  set('p-dash',`
    <div class="eyebrow">VISÃO GERAL</div>
    <div class="pg-t">Dashboard Financeiro</div>
    <div class="kpis">
      ${kpiHTML('Faturamento Bruto', tRec?R(tRec):'Sem dados', calcs.length+' eventos', '#e6edf3', '#2563eb')}
      ${kpiHTML('CMV Médio', tRec?P(cmvP):'—', tRec?(cmvP>0.28?'⚠ Acima de 28%':'✓ Dentro da meta'):'Cadastre eventos', cCmv(cmvP), cCmv(cmvP))}
      ${kpiHTML('Resultado do Mês', tRec?R(tRes):'—', tRec?'Margem '+P(tRes/tRec):'—', tRes>0?'#22c55e':'#ef4444', tRes>0?'#22c55e':'#ef4444')}
      ${kpiHTML('Custo VIP', tVip?R(tVip):'—', tRec?P(tVip/tRec)+' do fat.':'—', '#f59e0b', '#f59e0b')}
    </div>
    <div class="box">
      <div class="bh"><span class="bt">Resultado por Evento</span>
        <button class="btn bg_ bsm" onclick="exportExcel()">⬇ Excel</button>
      </div>
      <div class="tw"><table>
        <thead><tr><th>Data</th><th>Evento</th><th class="r">Faturamento</th><th class="r">CMV%</th><th class="r">VIP%</th><th class="r">Resultado</th><th class="r">Margem</th></tr></thead>
        <tbody>${calcs.length ? calcs.map(e=>`
          <tr>
            <td class="mn mt">${e.data||''}</td>
            <td style="font-weight:600">${e.nome||''}</td>
            <td class="r mn">${R(e.rec)}</td>
            <td class="r">${chip(P(e.cmvP),cCmv(e.cmvP))}</td>
            <td class="r">${chip(P(e.vipP),'#f59e0b')}</td>
            <td class="r mn" style="color:${e.res>0?'#22c55e':'#ef4444'};font-weight:600">${R(e.res)}</td>
            <td class="r">${chip(P(Math.max(0,e.mg)),e.mg>0.20?'#22c55e':e.mg>0.10?'#f59e0b':'#ef4444')}</td>
          </tr>`).join('') : '<tr><td colspan="7" class="empty">Nenhum evento ainda.</td></tr>'}
        </tbody>
      </table></div>
    </div>
    <div class="box">
      <div class="bh"><span class="bt">Receita por Canal</span></div>
      <div class="bb">${canais.map(c=>barRow(c.n,c.v,maxC,c.c)).join('')}</div>
    </div>
  `);
}

function exportExcel() {
  const calcs = S.eventos.map(e=>({...e,...calcEv(e)}));
  const rows = calcs.map(e=>({'Data':e.data,'Evento':e.nome,'Faturamento':e.rec,'Bar':e.bar||0,'Entrada':e.entrada||0,'CMV R$':e.cmv,'CMV%':P(e.cmvP),'VIP R$':e.vip_custo||0,'Resultado':e.res,'Margem%':P(e.mg)}));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Eventos');
  XLSX.writeFile(wb, 'mahau-eventos.xlsx');
}

// ── CARDÁPIO ──────────────────────────────────────────────────────────────────

function renderCard() {
  const cats = ['Todos',...[...new Set(MENU.map(d=>d.cat))]];
  const ticket = Math.round(MENU.reduce((s,d)=>s+d.preco,0)/MENU.length);
  const caro = MENU.reduce((a,b)=>b.preco>a.preco?b:a);
  const catData = [...new Set(MENU.map(d=>d.cat))].map(c=>({c,max:Math.max(...MENU.filter(d=>d.cat===c).map(d=>d.preco))})).sort((a,b)=>b.max-a.max).slice(0,10);
  const gmax = catData[0]?.max||1;

  let rows = MENU.filter(d=>{
    if(S.cardCat!=='Todos'&&d.cat!==S.cardCat) return false;
    const q=el('card-q')?.value?.toLowerCase()||'';
    if(q&&!d.nome.toLowerCase().includes(q)) return false;
    return true;
  });
  if(S.cardSort==='nome') rows.sort((a,b)=>a.nome.localeCompare(b.nome));
  if(S.cardSort==='desc') rows.sort((a,b)=>b.preco-a.preco);
  if(S.cardSort==='asc')  rows.sort((a,b)=>a.preco-b.preco);

  set('p-card',`
    <div class="eyebrow">PRODUTOS & PREÇOS DE VENDA</div>
    <div class="pg-t">Cardápio Mahau</div>
    <div class="kpis">
      ${kpiHTML('Total de Produtos', MENU.length, '20 categorias', '#e6edf3', '#2563eb')}
      ${kpiHTML('Ticket Médio', Rf(ticket), 'preço médio', '#22c55e', '#22c55e')}
      ${kpiHTML('Produto Mais Caro', Rf(caro.preco), caro.nome.slice(0,25), '#f59e0b', '#f59e0b')}
    </div>
    <div class="box">
      <div class="bh"><span class="bt">Faixa de preço por categoria</span></div>
      <div class="bb">${catData.map(({c,max})=>barRow(c,max,gmax,CC[c]||'#2563eb')).join('')}</div>
    </div>
    <div class="flt">
      <div class="sw"><span class="si">🔍</span><input id="card-q" class="si-inp" placeholder="Buscar produto..." oninput="renderCard()"></div>
      <div class="sbs">
        <button class="sb2${S.cardSort==='nome'?' on':''}" onclick="S.cardSort='nome';renderCard()">A–Z</button>
        <button class="sb2${S.cardSort==='desc'?' on':''}" onclick="S.cardSort='desc';renderCard()">MAIOR PREÇO</button>
        <button class="sb2${S.cardSort==='asc'?' on':''}" onclick="S.cardSort='asc';renderCard()">MENOR PREÇO</button>
      </div>
    </div>
    <div class="pills">${cats.map(c=>`<button class="pill${S.cardCat===c?' on':''}"
      style="${S.cardCat===c&&c!=='Todos'?`background:${CC[c]||'#2563eb'};border-color:${CC[c]||'#2563eb'}`:''}"
      onclick="S.cardCat='${c.replace(/'/g,"\\'")}';renderCard()">${c}</button>`).join('')}</div>
    <div class="box">
      <div class="bh"><span class="bt">${rows.length} produto${rows.length!==1?'s':''}</span></div>
      <div class="tw"><table>
        <thead><tr><th>Categoria</th><th>Produto</th><th class="r">Preço de Venda</th></tr></thead>
        <tbody>${rows.map(d=>`<tr>
          <td><span class="badge" style="background:${CC[d.cat]||'#2563eb'}18;color:${CC[d.cat]||'#2563eb'}">${d.cat}</span></td>
          <td style="font-weight:500">${d.nome}</td>
          <td class="r mn" style="font-weight:600">${Rf(d.preco)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
  `);
}

    id:evForm.id||null,
    data:sv('ef-data'), nome:sv('ef-nome'),
    publico:nv('ef-pub'), vips:nv('ef-vips'),
    bar:nv('ef-bar'), entrada:nv('ef-ent'),

    vip_custo:nv('ef-vip'), desperdicio:nv('ef-des'),
    dj:nv('ef-dj'), seguranca:nv('ef-seg'), staff:nv('ef-sta'), outros:nv('ef-out'),

  FS.save('eventos', ev);
  evForm=null;
}

  const sems = ['S1','S2','S3','S4'].map(s=>({
    s, items:S.compras.filter(c=>c.sem===s),
    total:S.compras.filter(c=>c.sem===s).reduce((a,c)=>a+(c.total||0),0)
  })).filter(x=>x.items.length);

  const formHTML = cpForm!==null ? `<div class="fb">
    <div class="ft">Nova Compra<button class="bi" onclick="cpForm=null;renderCompras()">✕</button></div>
    <div class="fg" style="grid-template-columns:70px 80px 1fr 60px 90px 90px 1fr;gap:8px;margin-bottom:12px">
      <div class="fi"><label>Semana</label><select id="cp-sem">${['S1','S2','S3','S4'].map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="fi"><label>Data</label><input id="cp-data" placeholder="15/05"></div>
      <div class="fi"><label>Produto</label><input id="cp-prod"></div>
      <div class="fi"><label>Qtd</label><input id="cp-qtd" type="number" oninput="calcCpTot()"></div>
      <div class="fi"><label>Custo Unit.</label><input id="cp-cu" type="number" oninput="calcCpTot()"></div>
      <div class="fi"><label>Total R$</label><input id="cp-tot" type="number"></div>
      <div class="fi"><label>Fornecedor</label><input id="cp-forn"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn bp" onclick="saveCp()">Salvar</button>
      <button class="btn bg_" onclick="cpForm=null;renderCompras()">Cancelar</button>
    </div>
  </div>` : '';

  set('p-compras',`
    <div class="pg-h">
      <div><div class="eyebrow">ENTRADAS DE ESTOQUE</div><div class="pg-t">Compras Semanais</div></div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="box" style="margin:0;padding:8px 16px;text-align:right">
          <div style="font-size:9px;color:#484f58;font-weight:600;letter-spacing:.8px">TOTAL MÊS</div>
          <div style="font-family:'Courier New';font-size:16px;font-weight:700;margin-top:2px">${R(total)}</div>
        </div>
        <button class="btn bp" onclick="cpForm={};renderCompras()">+ Nova Compra</button>
      </div>
    </div>
    ${formHTML}
    ${sems.length ? sems.map(({s,items,total})=>`
      <div class="wb">
        <div class="wh"><span style="font-size:11px;font-weight:700;color:#8b949e">SEMANA ${s.replace('S','')}</span><span style="font-family:'Courier New';font-weight:700;font-size:13px">${R(total)}</span></div>
        <div class="tw"><table>
          <thead><tr><th>Data</th><th>Produto</th><th class="r">Qtd</th><th class="r">Unit.</th><th class="r">Total</th><th>Fornecedor</th><th></th></tr></thead>
          <tbody>${items.map(c=>`<tr>
            <td class="mn mt">${c.data||''}</td><td>${c.produto||''}</td>
            <td class="r mn">${c.qtd||0}</td>
            <td class="r mn mt">${Rf(c.cu)}</td>
            <td class="r mn" style="font-weight:600">${R(c.total)}</td>
            <td class="mt">${c.forn||''}</td>
            <td><button class="bi" onclick="FS.del('compras','${c.id}')">✕</button></td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`).join('') : '<div class="box"><div class="empty">Nenhuma compra registrada ainda.</div></div>'}
  `);
}

function calcCpTot(){
  const q=parseFloat(el('cp-qtd')?.value)||0,u=parseFloat(el('cp-cu')?.value)||0,t=el('cp-tot');
  if(t)t.value=q*u||'';
}
function saveCp(){
  FS.save('compras',{id:null,sem:sv('cp-sem'),data:sv('cp-data'),produto:sv('cp-prod'),qtd:nv('cp-qtd'),cu:nv('cp-cu'),total:nv('cp-tot'),forn:sv('cp-forn')});
  cpForm=null;
}

// ── CUSTOS FIXOS ──────────────────────────────────────────────────────────────
function renderCustos() {
  const tf=totalFixo(), rat=rateio();
  set('p-custos',`
    <div class="eyebrow">ESTRUTURA</div>
    <div class="pg-t">Custos Fixos Mensais</div>
    <div class="kpis">
      ${kpiHTML('Total Fixo / Mês', R(tf), '', '#e6edf3', '#2563eb')}
      ${kpiHTML('Rateio por Evento', R(rat), '÷ '+S.config.datasNoMes+' eventos', '#e6edf3', '#3b82f6')}
      <div class="kpi" style="border-top:2px solid #21262d">
        <div class="kpi-l">Eventos / Mês</div>
        <div class="ctr" style="margin-top:8px">
          <button class="cb" onclick="FS.setDoc('config','settings',{...S.config,datasNoMes:Math.max(1,S.config.datasNoMes-1)})">–</button>
          <span class="cv">${S.config.datasNoMes}</span>
          <button class="cb" onclick="FS.setDoc('config','settings',{...S.config,datasNoMes:S.config.datasNoMes+1})">+</button>
        </div>
      </div>
    </div>
    <div class="fb">
      <div style="font-weight:600;margin-bottom:12px;font-size:13px">Adicionar custo fixo</div>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div class="fi" style="flex:2;min-width:160px"><label>Nome do Custo</label><input id="cf-nome" placeholder="Ex: Marketing"></div>
        <div class="fi" style="flex:1;min-width:120px"><label>Valor Mensal (R$)</label><input id="cf-val" type="number" placeholder="0"></div>
        <button class="btn bp" onclick="addCusto()">+ Adicionar</button>
      </div>
    </div>
    <div class="box"><div class="tw"><table>
      <thead><tr><th>Custo</th><th class="r">Mensal</th><th class="r">Rateio</th><th class="r">Part.%</th><th></th></tr></thead>
      <tbody>
        ${S.custos.map(c=>`<tr>
          <td style="font-weight:500">${c.nome}</td>
          <td class="r mn">${R(c.valor)}</td>
          <td class="r mn mt">${R((c.valor||0)/S.config.datasNoMes)}</td>
          <td class="r"><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><div class="prog"><div class="pf" style="width:${tf?(c.valor/tf*100).toFixed(1):0}%"></div></div><span style="font-family:'Courier New';font-size:10px;color:#484f58">${P(tf?c.valor/tf:0)}</span></div></td>
          <td><button class="bi" onclick="FS.del('custos','${c.id}')">✕</button></td>
        </tr>`).join('')}
        <tr class="tr-tot"><td>Total</td><td class="r mn" style="font-size:15px">${R(tf)}</td><td class="r mn">${R(rat)}</td><td></td><td></td></tr>
      </tbody>
    </table></div></div>
  `);
}

function addCusto() {
  const nome=sv('cf-nome').trim(), valor=parseFloat(el('cf-val')?.value)||0;
  if(!nome||!valor) return;
  FS.save('custos',{id:'c_'+Date.now(),nome,valor});
}

// ── ESTOQUE / CMV ─────────────────────────────────────────────────────────────
let estEdit = false;

function renderEstoque() {
  const calcs=S.eventos.map(e=>({...e,...calcEv(e)}));
  const tConsumo=calcs.reduce((s,e)=>s+Math.max(0,(e.compras||0)-(e.sobras||0)),0);
  const tVip=calcs.reduce((s,e)=>s+(e.vip_custo||0),0);
  const tDesp=calcs.reduce((s,e)=>s+(e.desperdicio||0),0);
  const tRec=calcs.reduce((s,e)=>s+e.rec,0);
  const tComp=totalCompras();
  const estAtu=Math.max(0,(S.config.estoqueInicial||0)+tComp-tConsumo);
  const cmvBebP=tRec?tConsumo/tRec:0;
  const cmvTotP=tRec?(tConsumo+tVip+tDesp)/tRec:0;
  const gColor=cmvBebP>0.30?'#ef4444':cmvBebP>0.28?'#f59e0b':'#22c55e';

  const eq=[
    {l:'Est. Inicial',v:S.config.estoqueInicial||0,c:'#3b82f6'},{op:'+'},{l:'Compras Mês',v:tComp,c:'#e6edf3'},
    {op:'–'},{l:'Consumido',v:tConsumo,c:'#f59e0b'},{op:'='},{l:'Est. Atual (est.)',v:estAtu,c:estAtu>0?'#22c55e':'#ef4444'}
  ];
  const bd=[
    {l:'CMV Bebidas',v:tConsumo,p:cmvBebP,c:'#3b82f6'},
    {l:'Custo VIP',v:tVip,p:tRec?tVip/tRec:0,c:'#f59e0b'},
    {l:'Desperdício',v:tDesp,p:tRec?tDesp/tRec:0,c:'#ef4444'},
  ];

  set('p-estoque',`
    <div class="eyebrow">CONTROLE DE CMV</div>
    <div class="pg-t">Estoque & CMV Mensal</div>
    <div class="box">
      <div class="bh"><span class="bt">Equação do CMV</span></div>
      <div class="bb"><div class="eq-wrap">
        ${eq.map(i=>i.op?`<div style="font-size:20px;color:#484f58;padding:0 2px">${i.op}</div>`:`
          <div class="eq-c" style="border-left-color:${i.c}"><div class="eq-l">${i.l}</div><div class="eq-v" style="color:${i.c}">${R(i.v)}</div></div>`).join('')}
      </div></div>
    </div>
    <div class="gr2">
      <div class="box" style="margin:0">
        <div class="bh"><span class="bt">Breakdown do CMV</span></div>
        <div class="bb">
          ${bd.map(r=>`<div class="br-row">
            <div class="br-m"><span style="color:#8b949e">${r.l}</span>
            <div style="display:flex;gap:10px;align-items:center"><span style="font-family:'Courier New';font-size:10px;color:#484f58">${P(r.p)}</span><span style="font-family:'Courier New';font-weight:600;color:${r.c}">${R(r.v)}</span></div></div>
            <div class="br-t"><div class="br-f" style="width:${Math.min(100,(r.p/0.40)*100).toFixed(1)}%;background:${r.c};opacity:.8"></div></div>
          </div>`).join('')}
          <div style="border-top:1px solid #21262d;padding-top:10px;display:flex;justify-content:space-between;align-items:center;margin-top:4px">
            <span style="font-weight:700;font-size:12px">CMV Total</span>
            <div style="display:flex;gap:10px;align-items:center">
              <span style="font-family:'Courier New';font-size:11px;color:${cmvTotP>0.35?'#ef4444':'#484f58'}">${P(cmvTotP)}</span>
              <span style="font-family:'Courier New';font-size:14px;font-weight:700;color:${cmvTotP>0.35?'#ef4444':cmvTotP>0.30?'#f59e0b':'#22c55e'}">${R(tConsumo+tVip+tDesp)}</span>
            </div>
          </div>
        </div>
      </div>
      <div class="box" style="margin:0">
        <div class="bh"><span class="bt">CMV Bebidas — Gauge</span></div>
        <div class="bb" style="text-align:center;padding:20px">
          <div style="font-family:'Courier New';font-size:44px;font-weight:700;color:${gColor}">${P(cmvBebP)}</div>
          <div style="font-size:11px;color:#484f58;margin-top:6px">Meta: até 28%</div>
          <div style="background:#1c2332;border-radius:6px;height:8px;margin:14px 0 6px;overflow:hidden">
            <div style="height:8px;border-radius:6px;background:linear-gradient(90deg,#22c55e,#f59e0b 70%,#ef4444);width:${Math.min(100,(cmvBebP/0.40)*100).toFixed(1)}%"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#484f58"><span>0%</span><span class="green">28%</span><span>40%</span></div>
        </div>
      </div>
    </div>
    <div class="box">
      <div class="bh"><span class="bt">Estoque de Abertura</span>
        <button class="btn bg_ bsm" onclick="estEdit=!estEdit;renderEstoque()">${estEdit?'Cancelar':'Editar'}</button>
      </div>
      <div class="bb">
        ${estEdit?`<div style="display:flex;gap:8px;align-items:flex-end">
          <div class="fi" style="flex:1"><label>Valor do Estoque Inicial (R$)</label><input id="est-inp" type="number" value="${S.config.estoqueInicial||''}"></div>
          <button class="btn bp" onclick="FS.setDoc('config','settings',{...S.config,estoqueInicial:nv('est-inp')});estEdit=false;">Salvar</button>
        </div>`:`
          <div style="font-family:'Courier New';font-size:34px;font-weight:700;color:#3b82f6">${R(S.config.estoqueInicial||0)}</div>
          <div style="font-size:11px;color:#484f58;margin-top:6px">Valor investido ao iniciar o sistema</div>`}
      </div>
    </div>
  `);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  initNav();
  render();

  try {
    FS.listen('eventos', d => { S.eventos=d; render(); });
    FS.listen('custos',  d => { S.custos=d; render(); });
    FS.listen('compras', d => { S.compras=d; render(); });
    db.collection('config').doc('settings').onSnapshot(s => {
      if(s.exists) S.config=s.data();
      render();
    });
  } catch(e) {
    console.warn('Firebase offline:', e.message);
  }
}

init();
</script>
</body>
</html>
