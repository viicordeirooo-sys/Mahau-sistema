<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahau · Sistema Financeiro</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="domain.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:#0d1117}::-webkit-scrollbar-thumb{background:#2d333b;border-radius:3px}
input,select,button{font-family:inherit}input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
#app{display:flex;height:100vh;overflow:hidden}
#sb{width:200px;background:#161b22;border-right:1px solid #21262d;display:flex;flex-direction:column;flex-shrink:0}
#main{flex:1;overflow:auto;padding:20px;background:#0d1117;padding-bottom:20px}
.sb-logo{padding:16px;border-bottom:1px solid #21262d}
.sb-tag{font-size:9px;color:#484f58;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:5px;margin-bottom:5px}
.sd{width:7px;height:7px;border-radius:1px;background:#2563eb}
.sb-name{font-size:16px;font-weight:800;letter-spacing:-.5px}
.sb-date{font-size:10px;color:#484f58;margin-top:2px}
#sbnav{padding:6px 0;flex:1;overflow-y:auto}
.nb{display:flex;align-items:center;gap:8px;padding:10px 14px;width:100%;background:none;border:none;border-left:2px solid transparent;color:#8b949e;cursor:pointer;font-size:12px;font-weight:400;text-align:left}
.nb.on{background:#1c2332;border-left-color:#2563eb;color:#e6edf3;font-weight:600}
.sb-sum{padding:12px 14px;border-top:1px solid #21262d}
.ss-t{font-size:9px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.ss-r{display:flex;justify-content:space-between;margin-bottom:4px}
.ss-l{font-size:10px;color:#484f58}.ss-v{font-size:10px;font-weight:600;font-family:monospace}
#bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:1px solid #21262d;z-index:100;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
.bn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px 10px;background:none;border:none;color:#484f58;cursor:pointer;font-size:8px;font-weight:600;letter-spacing:.5px;gap:3px;min-width:56px}
.bn.on{color:#2563eb}.bn svg{width:17px;height:17px;flex-shrink:0}
.page{display:none}.page.on{display:block}
.eyebrow{font-size:11px;color:#3b82f6;font-weight:600;letter-spacing:.8px;margin-bottom:4px}
.pg-t{font-size:20px;font-weight:700;letter-spacing:-.5px;margin-bottom:14px}
.pg-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.pg-h .pg-t{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:13px}
.kpi-l{font-size:9px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.kpi-v{font-size:17px;font-weight:700;font-family:monospace;line-height:1.2}
.kpi-s{font-size:10px;color:#484f58;margin-top:3px}
.box{background:#161b22;border:1px solid #21262d;border-radius:8px;overflow:hidden;margin-bottom:12px}
.bh{padding:9px 13px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center;background:#1c2332}
.bt{font-size:11px;color:#8b949e;font-weight:600}.bb{padding:13px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:400px}
th{padding:7px 10px;text-align:left;color:#484f58;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid #21262d;white-space:nowrap}
th.r{text-align:right}
td{padding:9px 10px;border-bottom:1px solid #1c2332;font-size:12px;color:#e6edf3}
td.r{text-align:right}td.mn{font-family:monospace}td.mt{color:#484f58}td.w6{font-weight:600}
tr:hover td{background:#1a2030}.tr-tot td{background:#1c2332;font-weight:700}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;font-family:monospace;white-space:nowrap}
.alert-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600}
.fb{background:#161b22;border:1px solid #2d333b;border-radius:8px;padding:14px;margin-bottom:12px}
.ft{font-weight:600;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.fg{display:grid;gap:8px;margin-bottom:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.fi{display:flex;flex-direction:column;gap:3px}
.fi label{font-size:9px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.fi input,.fi select{background:#1c2332;border:1px solid #2d333b;border-radius:5px;padding:9px 10px;color:#e6edf3;font-size:13px;outline:none;width:100%;font-family:monospace;-webkit-appearance:none}
.fi input:focus,.fi select:focus{border-color:#2563eb}
.slbl{font-size:9px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin:10px 0 6px}
.ing-row{display:grid;grid-template-columns:1fr 90px 32px;gap:6px;align-items:center;margin-bottom:6px}
.ing-sel{background:#1c2332;border:1px solid #2d333b;border-radius:5px;padding:8px 10px;color:#e6edf3;font-size:12px;outline:none;width:100%;-webkit-appearance:none}
.ing-ml{background:#1c2332;border:1px solid #2d333b;border-radius:5px;padding:8px 10px;color:#e6edf3;font-size:12px;outline:none;width:100%;font-family:monospace;-webkit-appearance:none}
.btn{border:none;border-radius:6px;padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.bp{background:#2563eb;color:#fff}.bg_{background:transparent;color:#8b949e;border:1px solid #2d333b}
.bd_{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.bsm{padding:4px 9px;font-size:10px}
.bi{background:none;border:none;color:#484f58;cursor:pointer;padding:3px 5px;font-size:16px;line-height:1}
.ctr{display:flex;align-items:center;gap:10px}
.cb{background:#1c2332;border:1px solid #2d333b;color:#e6edf3;border-radius:5px;width:32px;height:32px;cursor:pointer;font-size:16px;font-weight:700}
.cv{font-family:monospace;font-size:22px;font-weight:700}
.br-row{margin-bottom:8px}
.br-m{display:flex;justify-content:space-between;margin-bottom:3px;font-size:11px}
.br-t{background:#1c2332;border-radius:3px;height:5px;overflow:hidden}
.br-f{height:5px;border-radius:3px}
.prog{background:#1c2332;border-radius:3px;height:4px;overflow:hidden;width:44px;display:inline-block;vertical-align:middle;margin-right:5px}
.pf{height:4px;background:#2563eb;border-radius:3px}
.pills{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.pill{background:transparent;color:#484f58;border:1px solid #21262d;border-radius:20px;padding:4px 11px;font-size:10px;font-weight:600;cursor:pointer}
.pill.on{background:#2563eb;color:#fff;border-color:#2563eb}
.wb{background:#161b22;border:1px solid #21262d;border-radius:8px;margin-bottom:10px;overflow:hidden}
.wh{display:flex;justify-content:space-between;padding:9px 13px;background:#1c2332;border-bottom:1px solid #21262d}
.ev-card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:13px;margin-bottom:9px;cursor:pointer}
.ev-card.on{border-color:#2563eb;background:#1c2332}
.ech{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:9px}
.flt{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.sw{position:relative;flex:1;min-width:160px}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#484f58;pointer-events:none;font-size:12px}
.si-inp{background:#161b22;border:1px solid #21262d;border-radius:5px;padding:9px 9px 9px 29px;color:#e6edf3;font-size:12px;outline:none;width:100%;-webkit-appearance:none}
.sbs{display:flex;gap:5px;flex-wrap:wrap}
.sb2{background:transparent;color:#484f58;border:1px solid #2d333b;border-radius:5px;padding:7px 9px;font-size:10px;font-weight:600;cursor:pointer}
.sb2.on{background:#2563eb;color:#fff;border-color:#2563eb}
.dre-box{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px;margin-top:10px}
.dre-r{display:flex;justify-content:space-between;padding:3px 0;font-size:11px}
.dre-sep{border-top:1px solid #21262d;margin:7px 0}
.empty{text-align:center;padding:30px;color:#484f58}
.tag-ok{color:#22c55e}.tag-warn{color:#f59e0b}.tag-red{color:#ef4444}
.green{color:#22c55e}.red{color:#ef4444}.amber{color:#f59e0b}
.alert-strip{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:6px;padding:10px 13px;margin-bottom:10px;font-size:11px;color:#ef4444}
.ok-strip{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:6px;padding:10px 13px;margin-bottom:10px;font-size:11px;color:#22c55e}
.section-divider{font-size:9px;color:#484f58;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid #21262d}
@media(max-width:680px){
  #sb{display:none}#bnav{display:flex}
  #main{padding:14px;padding-bottom:68px}
  .g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}
  .pg-h{flex-direction:column;align-items:flex-start}
  .ing-row{grid-template-columns:1fr 80px 32px}
}
@media(min-width:681px){#bnav{display:none!important}#sb{display:flex}}


/* seletor de mês */
#month-bar{display:flex;align-items:center;gap:8px;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.mb-label{font-size:9px;color:#484f58;font-weight:600;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.mb-sel{background:#0d1117;border:1px solid #2d333b;border-radius:5px;padding:6px 10px;color:#e6edf3;font-size:13px;font-weight:600;font-family:monospace;outline:none;cursor:pointer;-webkit-appearance:none}
.mb-btn{background:transparent;border:1px solid #21262d;border-radius:5px;padding:5px 8px;color:#8b949e;cursor:pointer;font-size:13px;line-height:1}
.mb-btn:hover{border-color:#2563eb;color:#2563eb}
.mb-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.mb-all{background:#2563eb18;color:#3b82f6;border:1px solid #2563eb30}
.mb-mes{background:#22c55e18;color:#22c55e;border:1px solid #22c55e30}
.mb-sep{flex:1}
/* bulk edit */
.bulk-inp{background:#0d1117;border:1px solid #2d333b;border-radius:4px;padding:5px 7px;color:#e6edf3;font-size:11px;font-family:monospace;width:100%;-webkit-appearance:none;outline:none}
.bulk-inp:focus{border-color:#2563eb}
.bulk-save-bar{position:sticky;bottom:0;background:#0d1117;border-top:1px solid #21262d;padding:10px;display:flex;gap:8px;align-items:center;z-index:50}
.bulk-dirty{border-color:#f59e0b!important}
/* lista compras */
.lc-strip{background:rgba(37,99,235,.06);border:1px solid rgba(37,99,235,.2);border-radius:6px;padding:12px;margin-bottom:10px}
/* inventário */
.inv-ok{color:#22c55e}.inv-warn{color:#f59e0b}.inv-bad{color:#ef4444}
/* fechamento */
.fecha-sep{border-top:1px solid #21262d;margin:8px 0}
.fecha-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
/* modal confirmação destrutiva */
.dlg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(3px)}
.dlg-box{background:#161b22;border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:26px 24px;width:340px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg-warn{font-size:26px;text-align:center;margin-bottom:10px}
.dlg-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:8px;color:#e6edf3}
.dlg-desc{font-size:12px;color:#8b949e;text-align:center;margin-bottom:18px;line-height:1.65}
.dlg-desc strong{color:#ef4444}
.dlg-inp{width:100%;background:#0d1117;border:2px solid #2d333b;border-radius:6px;padding:10px 12px;color:#e6edf3;font-size:17px;font-family:monospace;font-weight:700;text-align:center;outline:none;margin-bottom:16px;letter-spacing:3px;transition:border-color .15s}
.dlg-inp:focus{border-color:#ef4444}
.dlg-inp.ok{border-color:#22c55e;color:#22c55e}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end}
/* toasts */
#toast-wrap{position:fixed;bottom:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;max-width:min(360px,92vw);pointer-events:none}
.toast{background:#161b22;border:1px solid #2d333b;border-left:3px solid #2563eb;border-radius:8px;padding:11px 14px;font-size:12px;color:#e6edf3;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast-in .2s ease}
.toast.err{border-left-color:#ef4444}.toast.ok{border-left-color:#22c55e}
.toast-t{font-weight:700;margin-bottom:2px;color:#8b949e}
.toast.err .toast-t{color:#ef4444}.toast.ok .toast-t{color:#22c55e}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:680px){#toast-wrap{bottom:72px;right:8px;left:8px;max-width:none}}
/* utilitário */
.hidden{display:none!important}
/* login */
.login-screen{position:fixed;inset:0;z-index:9998;background:#0d1117;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#161b22;border:1px solid #21262d;border-radius:12px;padding:30px 26px;width:340px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.login-logo{font-size:24px;font-weight:800;letter-spacing:-.5px;text-align:center}
.login-tag{font-size:9px;color:#484f58;font-weight:600;letter-spacing:1.5px;text-align:center;margin-bottom:22px}
.login-box .fi{margin-bottom:12px}
.login-box .fi input{background:#0d1117}
.login-err{color:#ef4444;font-size:11px;margin-top:10px;min-height:14px;text-align:center}
/* auth na sidebar */
.sb-auth{padding:10px 14px;border-top:1px solid #21262d;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-auth-email{font-size:10px;color:#484f58;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-logout{background:transparent;border:1px solid #2d333b;color:#8b949e;border-radius:5px;padding:5px 9px;font-size:10px;font-weight:600;cursor:pointer;flex-shrink:0}
.sb-logout:hover{border-color:#ef4444;color:#ef4444}
</style>
</head>
<body>
<div id="app">
<div id="sb">
  <div class="sb-logo">
    <div class="sb-tag"><span class="sd"></span>SISTEMA FINANCEIRO</div>
    <div class="sb-name">Mahau Balada</div>
    <div class="sb-date" id="sb-date"></div>
  </div>
  <div id="sbnav"></div>
  <div class="sb-sum">
    <div class="ss-t">Resumo</div>
    <div class="ss-r"><span class="ss-l">Faturamento</span><span class="ss-v" id="ss-fat">—</span></div>
    <div class="ss-r"><span class="ss-l">Custos Var.</span><span class="ss-v" id="ss-cmv">—</span></div>
    <div class="ss-r"><span class="ss-l">Resultado</span><span class="ss-v" id="ss-res">—</span></div>
    <div class="ss-r"><span class="ss-l">Alertas Estoque</span><span class="ss-v tag-red" id="ss-alr">—</span></div>
  </div>
  <div class="sb-auth" id="sb-auth"></div>
</div>
<div id="main">
  <div id="month-bar"></div>
  <div id="p-dash"    class="page on"></div>
  <div id="p-prod"    class="page"></div>
  <div id="p-fichas"  class="page"></div>
  <div id="p-estoque" class="page"></div>
  <div id="p-compras" class="page"></div>
  <div id="p-eventos" class="page"></div>
  <div id="p-custos"  class="page"></div>
  <div id="p-cmv"     class="page"></div>
  <div id="p-inv"     class="page"></div>
  <div id="p-fecha"   class="page"></div>
  <div id="p-concil"  class="page"></div>
  <div id="p-lixeira" class="page"></div>
</div>
</div>
<div id="bnav" style="overflow-x:auto;-webkit-overflow-scrolling:touch">
  <button class="bn on" id="bn-dash"    onclick="go('dash')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>DASH</button>
  <button class="bn" id="bn-prod"    onclick="go('prod')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>PROD.</button>
  <button class="bn" id="bn-fichas"  onclick="go('fichas')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>FICHAS</button>
  <button class="bn" id="bn-estoque" onclick="go('estoque')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>ESTOQUE</button>
  <button class="bn" id="bn-compras" onclick="go('compras')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6h18l-3-4z"/><path d="M3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6"/></svg>COMPRAS</button>
  <button class="bn" id="bn-eventos" onclick="go('eventos')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>EVENTOS</button>
  <button class="bn" id="bn-custos"  onclick="go('custos')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>FIXOS</button>
  <button class="bn" id="bn-cmv"     onclick="go('cmv')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>CMV</button>
  <button class="bn" id="bn-inv"    onclick="go('inv')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>INV.</button>
  <button class="bn" id="bn-fecha"  onclick="go('fecha')">

const FS = {
  // Retornam true/false. Em caso de erro, mostram toast — nunca falham em silêncio.
  save: async (col,data) => {
    if(!db){ toast("Banco indisponível — alteração não salva.","err"); return false; }
    try {
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      // Update usa merge:true para não apagar createdAt/orgId (e campos futuros) no overwrite.
      if(data.id) await db.collection(col).doc(String(data.id)).set({...data, updatedAt:ts}, {merge:true});
      // Campos de criação (orgId/createdAt/updatedAt) via fonte única Domain.camposCriacao.
      else { const r=await db.collection(col).add(Domain.camposCriacao(data, ts)); await r.update({id:r.id}); }
      return true;
    } catch(e){ toast(FS._msg(e),"err","Falha ao salvar"); return false; }
  },
  // Soft-delete: marca deletedAt (vai para a Lixeira). Use hardDel para apagar de vez.
  del: async (col,id) => {
    if(!db){ toast("Banco indisponível — exclusão não realizada.","err"); return false; }
    try {
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(col).doc(String(id)).set({deletedAt:ts, updatedAt:ts},{merge:true}); return true;
    } catch(e){ toast(FS._msg(e),"err","Falha ao excluir"); return false; }
  },
  restore: async (col,id) => {
    if(!db){ toast("Banco indisponível.","err"); return false; }
    try {
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(col).doc(String(id)).update({deletedAt:firebase.firestore.FieldValue.delete(), updatedAt:ts}); return true;
    } catch(e){ toast(FS._msg(e),"err","Falha ao restaurar"); return false; }
  },
  hardDel: async (col,id) => {
    if(!db){ toast("Banco indisponível — exclusão não realizada.","err"); return false; }
    try { await db.collection(col).doc(String(id)).delete(); return true; }
    catch(e){ toast(FS._msg(e),"err","Falha ao excluir"); return false; }
  },
  setDoc: async (col,id,d) => {
    if(!db){ toast("Banco indisponível — alteração não salva.","err"); return false; }
    try {
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(col).doc(id).set({...d, updatedAt:ts},{merge:true}); return true;
    } catch(e){ toast(FS._msg(e),"err","Falha ao salvar"); return false; }
  },
  listen: (col,cb) => db
    ? db.collection(col).onSnapshot(
        s=>cb(s.docs.map(d=>d.data())),
        e=>toast(FS._msg(e),"err","Falha ao carregar "+col))
    : null,
  _msg: (e) => {
    const c=e&&e.code;
    if(c==="permission-denied") return "Permissão negada pelo banco. Verifique se você está logado.";
    if(c==="unavailable")       return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
    return (e&&e.message) || "Erro desconhecido ao acessar o banco.";
  },
};

// ── TOAST ─────────────────────────────────────────────────────────────────────
// Notificação não-bloqueante. tipo: "err" | "ok" | "info" (default)
function toast(msg, tipo="info", titulo){
  let wrap=el("toast-wrap");
  if(!wrap){ wrap=document.createElement("div"); wrap.id="toast-wrap"; document.body.appendChild(wrap); }
  const t=document.createElement("div");
  t.className="toast"+(tipo==="err"?" err":tipo==="ok"?" ok":"");
  const ttl=titulo||(tipo==="err"?"Erro":tipo==="ok"?"Pronto":"Aviso");
  t.innerHTML=`<div class="toast-t">${ttl}</div><div>${msg}</div>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); }, tipo==="err"?6000:3000);
}

// Valida uma lista de [condição, mensagem]; no primeiro erro mostra toast e retorna false.
function validar(regras){
  for(const [ok,msg] of regras){ if(!ok){ toast(msg,"err","Dados inválidos"); return false; } }
  return true;
}

function confirmarLimpar(cb) {
  const ov = document.createElement('div');
  ov.className = 'dlg-overlay';
  ov.innerHTML = `
    <div class="dlg-box">
      <div class="dlg-warn">⚠</div>
      <div class="dlg-title">Confirmar exclusão permanente</div>
      <div class="dlg-desc">Esta ação <strong>não pode ser desfeita</strong>.<br>
        Digite <strong>LIMPAR</strong> em maiúsculas para confirmar:</div>
      <input class="dlg-inp" id="_dlg_inp" type="text" autocomplete="off" spellcheck="false" placeholder="LIMPAR">
      <div class="dlg-btns">
        <button class="btn bg_" id="_dlg_cancel">Cancelar</button>
        <button class="btn bd_" id="_dlg_ok" disabled>Excluir</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const inp = ov.querySelector('#_dlg_inp');
  const btnOk = ov.querySelector('#_dlg_ok');
  const btnCancel = ov.querySelector('#_dlg_cancel');

  setTimeout(() => inp.focus(), 30);

  function fechar() { ov.remove(); }
  function confirmar() { fechar(); cb(); }

  inp.addEventListener('input', () => {
    const ok = inp.value === 'LIMPAR';
    btnOk.disabled = !ok;
    inp.classList.toggle('ok', ok);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !btnOk.disabled) confirmar();
    if (e.key === 'Escape') fechar();
  });
  btnOk.addEventListener('click', confirmar);
  btnCancel.addEventListener('click', fechar);
  ov.addEventListener('click', e => { if (e.target === ov) fechar(); });
}

function mesesDisponiveis(){
  const set=new Set();
  S.eventos.forEach(e=>{const m=e.mes||mesDeData(e.data); if(m)set.add(m);});
  S.compras.forEach(c=>{const m=c.mes||mesDeData(c.data); if(m)set.add(m);});
  S.inventarios.forEach(i=>{if(i.mes)set.add(i.mes)});
  S.custos.forEach(c=>{if(c.mes)set.add(c.mes)});
  return [...set].sort().reverse();
}

function fmtMes(ym){
  // ym = "2025-05" → "Mai 2025"
  if(!ym) return "";
  const [y,m]=ym.split("-");
  const nomes=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${nomes[parseInt(m)]} ${y}`;
}

function renderMonthBar(){

  const opts=meses.map(m=>`<option value="${m}"${S.mesSel===m?" selected":""}>${fmtMes(m)}</option>`).join("");

function navMes(delta){
  const meses=mesesDisponiveis();
  if(!meses.length) return;
  if(!S.mesSel){
    S.mesSel = delta<0 ? meses[0] : meses[meses.length-1];
  } else {
    const idx=meses.indexOf(S.mesSel);
    // meses está em ordem decrescente (mais recente primeiro)
    const next=idx-delta; // inverso pq desc
    if(next>=0&&next<meses.length) S.mesSel=meses[next];
  }
  render();
}

// ── CALCS (wrappers finos sobre domain.js — a lógica pura e testável vive lá) ──
// O índice de estoque é memoizado aqui e invalidado em bindData (_estoqueIdx=null)
// quando produtos/compras/inventarios/inventarios_mensais mudam.
// Estoque = última contagem física (semanal ou mensal) + compras desde então,
// comparando por createdAt (timestamp do servidor).
let _estoqueIdx=null;
function tsMs(t){ return t && typeof t.toMillis==="function" ? t.toMillis() : (t&&t.seconds?t.seconds*1000:0); }
function estoqueIndex(){
  if(_estoqueIdx) return _estoqueIdx;
  const contagens=[...S.inventarios,...S.inventarios_mensais].map(i=>({createdAtMs:tsMs(i.createdAt),contagens:i.contagens||{}}));
  const compras=S.compras.map(c=>({produto_id:c.produto_id,qtd:c.qtd||0,createdAtMs:tsMs(c.createdAt)}));
  // Baixas de venda do import Zig por evento (zig_baixas = {produto_id: unidades}).
  // Timing pelo createdAt do evento, igual às compras (subtrai só as posteriores à última contagem).
  const baixas=[];
  S.eventos.forEach(e=>{ const b=e.zig_baixas; if(!b) return; const ms=tsMs(e.createdAt);
    Object.entries(b).forEach(([pid,un])=>baixas.push({produto_id:pid, unidades:un||0, createdAtMs:ms})); });
  return (_estoqueIdx = Domain.estoqueIndex(S.produtos, compras, contagens, baixas));
}
function estoqueAtual(pid){ return Domain.estoqueAtualFrom(S.produtos.find(x=>x.id===pid), estoqueIndex()); }
function calcEv(e){ return Domain.calcEv(e, rateio()); }

function alertasEstoque() {
  return S.produtos.filter(p=>{
    const min = p.estoque_min||0;
    if(min===0) return false; // só alerta se mínimo foi definido
    return estoqueAtual(p.id) < min;
  });
}

// Coalesce múltiplos disparos (ex.: 8 snapshots no load) em um único render por frame.
// Ações de usuário continuam chamando render() direto para resposta imediata.
let _renderQueued=false;
function scheduleRender(){
  if(_renderQueued) return;
  _renderQueued=true;
  requestAnimationFrame(()=>{ _renderQueued=false; render(); });
}

}

function setBulk(pid,field,val){
  if(!bulkChanges[pid]) bulkChanges[pid]={};
  bulkChanges[pid][field]=val;

// Recalcula a célula de Margem ao vivo no Editar em Massa (custo/venda já em bulkChanges).
function updateBulkMargem(pid){
  const cell=document.getElementById("bulk-mg-"+pid); if(!cell) return;
  const p=S.produtos.find(x=>x.id===pid)||{}, bc=bulkChanges[pid]||{};
  const custo=bc.preco_compra!==undefined?bc.preco_compra:(p.preco_compra||0);
  const venda=bc.preco_venda!==undefined?bc.preco_venda:(p.preco_venda||0);
  if(venda>0&&custo>0){ const mg=(venda-custo)/venda; cell.innerHTML=chip(P(mg),mg>0.5?"#22c55e":mg>0.3?"#f59e0b":"#ef4444"); }
  else cell.textContent="—";
}

async function saveBulkAll(){
  const ids=Object.keys(bulkChanges);
  if(ids.length===0){alert("Nenhuma alteração pendente.");return;}
  const btn=event.target;
  btn.textContent="Salvando...";btn.disabled=true;
  let saved=0, falhas=0;
  for(const pid of ids){
    const p=S.produtos.find(x=>x.id===pid);
    if(!p) continue;
    const updated={...p,...bulkChanges[pid]};
    const ok=await FS.save("produtos",updated);
    if(ok){ delete bulkChanges[pid]; saved++; } else { falhas++; }
  }
  if(falhas){
    btn.textContent="⚠ "+falhas+" falha(s)"; btn.disabled=false;
    toast(saved+" salvo(s), "+falhas+" falharam. As alterações não salvas foram mantidas para nova tentativa.","err");
  } else {
    btn.textContent="✓ Salvo!"; setTimeout(()=>{bulkMode=false;renderProd();},600);
  }
}

function renderListaCompras(){
  const criticos=S.produtos.filter(p=>{
    const min=p.estoque_min||0;
    if(!min) return false;
    return estoqueAtual(p.id)<min;
  }).map(p=>({
    ...p,
    atual:estoqueAtual(p.id),
    falta:Math.max(0,(p.estoque_min||0)-estoqueAtual(p.id)),
    sugestao:Math.ceil(Math.max(0,(p.estoque_min||0)*1.5-estoqueAtual(p.id))),
  })).sort((a,b)=>b.falta-a.falta);

  const atentos=S.produtos.filter(p=>{
    const min=p.estoque_min||0;
    if(!min) return false;
    const at=estoqueAtual(p.id);
    return at>=min && at<min*1.5;
  }).map(p=>({...p,atual:estoqueAtual(p.id)}));

  const totalEst=criticos.reduce((s,p)=>s+p.sugestao*(p.preco_compra||0),0);

  let txt="*Lista de Compras Mahau*\n";
  txt+=new Date().toLocaleDateString("pt-BR")+"\n\n";
  txt+="*URGENTE (abaixo do mínimo):*\n";
  criticos.forEach(p=>{ txt+=`• ${p.nome}: ${p.sugestao} ${p.unidade||"un"}\n`; });
  if(atentos.length){ txt+="\n*Atenção (próximo do mínimo):*\n"; atentos.forEach(p=>{ txt+=`• ${p.nome}: atual ${p.atual.toFixed(1)} ${p.unidade||"un"}\n`; }); }

  set("lista-compras-container",`
    <div class="lc-strip">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-weight:700;font-size:13px">📋 Lista de Compras</div>
        <div style="display:flex;gap:6px">
          <button class="btn bg_ bsm" onclick="copiarLista(\`${txt.replace(/`/g,"\`")}\`)">📱 Copiar WhatsApp</button>
          <button class="btn bg_ bsm" onclick="showListaCompras=false;renderEstoque()">✕</button>
        </div>
      </div>
      ${criticos.length?`
      <div class="section-divider">⚠ URGENTE — abaixo do mínimo (${criticos.length} produtos)</div>
      <div class="tw"><table>
        <thead><tr><th>Produto</th><th class="r">Atual</th><th class="r">Mínimo</th><th class="r">Sugestão compra</th><th class="r">Custo est.</th></tr></thead>
        <tbody>${criticos.map(p=>`<tr>
          <td class="w6">${p.nome}</td>
          <td class="r mn inv-bad">${p.atual.toFixed(1)} ${p.unidade||"un"}</td>
          <td class="r mn">${p.estoque_min} ${p.unidade||"un"}</td>
          <td class="r mn" style="color:#3b82f6;font-weight:700">${p.sugestao} ${p.unidade||"un"}</td>
          <td class="r mn">${p.preco_compra?R(p.sugestao*(p.preco_compra||0)):"—"}</td>
        </tr>`).join("")}
        <tr class="tr-tot"><td>Total estimado</td><td colspan="3"></td><td class="r mn">${R(totalEst)}</td></tr>
        </tbody>
      </table></div>`:""
      }
      ${atentos.length?`
      <div class="section-divider" style="margin-top:14px">⚡ ATENÇÃO — próximo do mínimo (${atentos.length} produtos)</div>
      <div style="font-size:11px;color:#f59e0b">${atentos.map(p=>`${p.nome} (${p.atual.toFixed(1)}/${p.estoque_min})`).join("  ·  ")}</div>`:""
      }
      ${!criticos.length&&!atentos.length?`<div class="empty" style="padding:20px">✓ Estoque OK em todos os produtos com mínimo definido</div>`:""
      }
    </div>
  `);
}

function copiarLista(txt){
  navigator.clipboard.writeText(txt).then(()=>alert("Copiado! Cole no WhatsApp.")).catch(()=>alert(txt));
}

function calcCpTot(){
  const q=parseFloat(el("cp-qtd")?.value)||0;
  const u=parseFloat(el("cp-cu")?.value)||0;
  const t=el("cp-tot"); if(t&&q&&u) t.value=(q*u).toFixed(2);
}

function saveCp(){
  const pid=sv("cp-prod");
  const p=S.produtos.find(x=>x.id===pid);
  const qtd=nv("cp-qtd");
  const cu=nv("cp-cu")||(p?p.preco_compra:0);
  // Data vazia → hoje em ISO (YYYY-MM-DD), em vez de barrar.
  const data=sv("cp-data")||new Date().toISOString().slice(0,10);
  if(!validar([
    [pid, "Selecione um produto."],
    [qtd>0, "A quantidade deve ser maior que zero."],
    [cu>=0, "O custo unitário não pode ser negativo."],
  ])) return;
  FS.save("compras",{
    id:null,produto_id:pid,sem:sv("cp-sem"),
    data,mes:mesDeData(data),qtd,custo_unit:cu,
    total:nv("cp-tot")||qtd*cu,forn:sv("cp-forn"),
  });
  cpForm=null;
}

// ── Import "total-produtos-vendidos" da Zig → baixa de estoque do evento (Sprint 3) ──
// Lê as 2 abas (Vendidos + Montáveis), mostra o que vai baixar e aplica no estoqueAtual.
function fmtDT(iso){ try{ return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return iso||""; } }

function importVendidosHTML(ev){
  const imp=(prodVendidosImport && prodVendidosImport.evento_id===ev.id)?prodVendidosImport:null;
  const jaImportado=!!ev.zig_importado_em;
  let html=`<div class="fb">
    <div class="ft">📥 Importar produtos vendidos da Zig — ${ev.nome||""} · ${fmtData(ev.data)}</div>
    <div style="font-size:11px;color:#484f58;margin-bottom:10px">XLSX <strong>"total-produtos-vendidos"</strong> da Zig (do dia do evento). Só <strong>baixa o estoque</strong> via mapeamento — não mexe em faturamento/porta/caixinha. Nos combos, a garrafa e os mixers reais vêm da aba <em>Montáveis</em>.</div>
    <input type="file" id="ev-zig-file" accept=".xlsx,.xls" onchange="importProdVendidosFile(this)" style="background:#1c2332;border:1px solid #2d333b;border-radius:5px;padding:9px 10px;color:#e6edf3;font-size:12px;width:100%">
    ${jaImportado?`<div class="alert-strip" style="background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#22c55e;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span>✓ Baixa aplicada em <strong>${fmtDT(ev.zig_importado_em)}</strong>${ev.zig_arquivo_nome?" · "+ev.zig_arquivo_nome:""} · ${ev.zig_total_itens||0} itens · ${Object.keys(ev.zig_baixas||{}).length} produtos no estoque</span>
      <button class="btn bd_ bsm" onclick="removerBaixaEvento('${ev.id}')">Remover baixa</button>
    </div>`:""}
  </div>`;
  if(!imp) return html;

  const r=Domain.baixaEvento({vendidos:imp.vendidos, montaveis:imp.montaveis, mapeamentos:S.mapeamento_zig, produtos:S.produtos});
  const linhas=Object.entries(r.baixas).map(([pid,un])=>({pid, un, nome:(S.produtos.find(p=>p.id===pid)||{}).nome||pid})).sort((a,b)=>b.un-a.un);
  const dataArq=imp.data?fmtData(imp.data):"—";

  html+=`<div class="kpis">
    ${kpi("Itens vendidos",r.total_itens.toLocaleString("pt-BR"),imp.fileName,"#e6edf3","#2563eb")}
    ${kpi("Valor total",R(r.total_valor),"data do arquivo: "+dataArq,"#e6edf3","#8b5cf6")}
    ${kpi("Linhas montáveis",imp.montaveis.length+"","garrafas/mixers/itens","#e6edf3","#f59e0b")}
    ${kpi("Produtos que baixam",linhas.length+"","no estoque","#e6edf3","#22c55e")}
  </div>`;

  const faltamPreco=precosFaltantes(imp);
  if(faltamPreco.length){
    html+=`<div class="fb" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;color:#8b949e">${faltamPreco.length} mapeamento(s) sem preço Zig — o arquivo tem o valor unitário desses SKUs (ajuda nas cortesias da Conciliação).</span>
      <button class="btn bg_ bsm" onclick="preencherPrecosZig()">Preencher preços faltantes</button>
    </div>`;
  }

  const nm=r.naoMapeados;
  if(nm.skus.length||nm.nomes.length){
    html+=`<div class="box"><div class="bh"><span class="bt">⚠ Não mapeados — não baixam nada</span></div>
      <div class="tw"><table><thead><tr><th>Origem</th><th>Item</th><th class="r">Qtd Zig</th><th class="r">Ação</th></tr></thead><tbody>
      ${nm.skus.map((s,i)=>`<tr><td class="mn mt">SKU ${s.sku}</td><td class="w6">${s.nome||""}</td><td class="r mn">${s.quantidade}</td>
        <td class="r"><button class="btn bg_ bsm" onclick="mapearNaoMapeado('sku',${i})">mapear</button></td></tr>`).join("")}
      ${nm.nomes.map((n,i)=>`<tr><td class="mn">montável</td><td class="w6">${n.nome||""}</td><td class="r mn">${n.quantidade}</td>
        <td class="r"><button class="btn bg_ bsm" onclick="mapearNaoMapeado('nome',${i})">mapear</button></td></tr>`).join("")}
      </tbody></table></div>
      <div style="font-size:10px;color:#484f58;padding:6px 10px">Modifiers (ponto da carne, "sem limão", adicionais) aparecem aqui e devem mesmo ficar <strong>sem</strong> mapeamento.</div>
    </div>`;
  }

  html+=`<div class="box"><div class="bh"><span class="bt">Baixa no estoque — ${linhas.length} produto(s)</span></div>
    <div class="tw"><table><thead><tr><th>Produto</th><th class="r">Unidades a baixar</th></tr></thead><tbody>
    ${linhas.length?linhas.map(l=>`<tr><td class="w6">${l.nome}</td><td class="r mn">${fmtU(l.un)}</td></tr>`).join(""):`<tr><td colspan="2"><div class="empty">Nada a baixar — mapeie os itens acima.</div></td></tr>`}
    </tbody></table></div></div>`;

  html+=`<div class="fb">
    ${jaImportado?`<div class="alert-strip" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25);color:#f59e0b">Este evento já teve baixa aplicada. <strong>Aplicar de novo substitui</strong> a anterior — o estoque é recalculado do zero (sem dupla baixa).</div>`:""}
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn bg_" onclick="prodVendidosImport=null;renderEventos()">✕ Descartar</button>
      <button class="btn bp" onclick="aplicarBaixaEvento()"${linhas.length?"":" disabled style=\"opacity:.5;cursor:not-allowed\""}>✓ ${jaImportado?"Substituir baixa":"Aplicar baixa no estoque"}</button>
    </div></div>`;
  return html;
}

// Mapeamentos com SKU presente no arquivo (com valor unitário) mas sem preco_zig ainda.
function precosFaltantes(imp){
  const bySku={}; (imp.vendidos||[]).forEach(v=>{ if(v.sku && v.valor_unitario>0 && bySku[v.sku]===undefined) bySku[v.sku]=v.valor_unitario; });
  return S.mapeamento_zig.filter(m=>m.sku_zig && bySku[m.sku_zig]!==undefined && !(m.preco_zig>0))
    .map(m=>({id:m.id, preco:bySku[m.sku_zig]}));
}
async function preencherPrecosZig(){

function importProdVendidosFile(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const evid=evSel;
  if(!evid){ toast("Selecione um evento primeiro.","err","Import"); return; }
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const toM=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,blankrows:false});
      let mVend=null, mMont=null;
      for(const n of wb.SheetNames){
        const m=toM(n);
        if(!mVend && !Domain.parseProdutosVendidos(m).erro) mVend=m;
        if(!mMont && !Domain.parseMontaveis(m).erro) mMont=m;
      }
      if(!mVend){ toast("Não encontrei a aba de produtos vendidos (SKU/Nome/Quantidade).","err","Import"); return; }
      prodVendidosImport={
        evento_id:evid, fileName:file.name,
        data:Domain.extrairDataZigEvento(mVend)||"",
        vendidos:Domain.parseProdutosVendidos(mVend).itens,
        montaveis:mMont?Domain.parseMontaveis(mMont).itens:[]
      };
      renderEventos();
    }catch(err){ toast(err.message||"Falha ao ler o arquivo.","err","Import"); }
  };
  reader.readAsArrayBuffer(file);
}

  ])) return;

  if(!ok) return;
  invContagens={};
  const novos=Object.keys(contagens).length, total=Object.keys(contagensFinais).length;

}

// CMV Real (contábil) do mês selecionado: Estoque Inicial (mês anterior) + Compras − Estoque Final.
// Encadeado: o inventário mensal de M−1 é o estoque inicial de M.
function cmvRealMensal(){
  if(!S.mesSel) return {semMes:true};
  const mes=S.mesSel, mesPrev=Domain.mesAnterior(mes);
  const invFinal=S.inventarios_mensais.find(i=>i.mes===mes);
  const invInicial=S.inventarios_mensais.find(i=>i.mes===mesPrev);
  const compras=totalComprasMes();
  const final$=invFinal?Domain.valorInventario(invFinal.contagens,S.produtos):null;
  const inicial$=invInicial?Domain.valorInventario(invInicial.contagens,S.produtos):null;
  const cmv=(invFinal&&invInicial)?(inicial$+compras-final$):null;
  return {mes,mesPrev,inicial$,final$,compras,cmv,temFinal:!!invFinal,temInicial:!!invInicial};
}

// Bloco visual CMV Real (e, se `teorico` for passado, comparação com o teórico + desvio).
function blocoCmvReal(teorico){
  const cr=cmvRealMensal();
  let inner;
  if(cr.semMes){
    inner=`<div class="empty">Selecione um mês específico no topo para ver o CMV Real.</div>`;
  } else if(!cr.temFinal||!cr.temInicial){
    const faltam=[];
    if(!cr.temInicial) faltam.push("inicial — contagem de "+fmtMes(cr.mesPrev));
    if(!cr.temFinal) faltam.push("final — contagem de "+fmtMes(cr.mes));
    inner=`<div class="empty">CMV Real indisponível. Faltam contagens mensais:<br><strong>${faltam.join("<br>")}</strong><br>
      <span style="font-size:10px">Faça a contagem na aba <strong>Mensal</strong> do Inventário.</span></div>`;
  } else {
    const desvio = teorico!=null ? cr.cmv-teorico : null;
    const linhas=[
      {l:"Estoque Inicial ("+fmtMes(cr.mesPrev)+")",v:R(cr.inicial$)},
      {l:"(+) Compras do mês",v:R(cr.compras)},
      {l:"(–) Estoque Final ("+fmtMes(cr.mes)+")",v:"– "+R(cr.final$)},
      {sep:true},
      {l:"= CMV Real",v:R(cr.cmv),bold:true,c:"#e6edf3"},
    ];
    if(teorico!=null){
      linhas.push({l:"CMV Teórico (vendas)",v:R(teorico),c:"#8b949e"});
      linhas.push({l:"Desvio (Real − Teórico)",v:R(desvio),bold:true,c:Math.abs(desvio)<1?"#22c55e":(desvio>0?"#ef4444":"#f59e0b")});
    }
    inner=linhas.map(r=>r.sep?`<div class="fecha-sep"></div>`:`
      <div class="fecha-row">
        <span style="color:${r.c||"#8b949e"};font-weight:${r.bold?700:400}">${r.l}</span>
        <span style="font-family:monospace;font-weight:${r.bold?700:400};color:${r.c||"#e6edf3"}">${r.v}</span>
      </div>`).join("");
    if(teorico!=null) inner+=`<div style="font-size:10px;color:#484f58;margin-top:8px">Desvio positivo = saiu mais estoque do que as vendas explicam (perdas/quebras/erros).</div>`;
  }
  return `<div class="box"><div class="bh"><span class="bt">CMV Real (inventário)${teorico!=null?" vs Teórico":""}</span></div><div class="bb">${inner}</div></div>`;
}

function exportarExcel(){
  if(!window.XLSX){alert("SheetJS não carregado.");return;}
  const wb=XLSX.utils.book_new();

  // Sheet 1: DRE por evento
  const calcs=S.eventos.filter(e=>noMes(e.mes||e.data)).map(e=>({...e,...calcEv(e)}));
  const ws1Data=[["Data","Evento","Bar Bruto","Bar Líquido","Porta","Caixinha","Caixinha Casa","Receita Casa","Custos Diretos","Resultado","Margem%"]];
  calcs.forEach(e=>ws1Data.push([e.data||"",e.nome||"",e.barBruto,e.barLiquido,e.porta,e.caixinha,e.caixinhaCasa,e.receitaCasa,e.custosDiretos,e.resultado,+(Math.max(0,e.mg)*100).toFixed(1)]));
  const sum=k=>calcs.reduce((s,e)=>s+(e[k]||0),0);
  ws1Data.push(["","TOTAL",sum("barBruto"),sum("barLiquido"),sum("porta"),sum("caixinha"),sum("caixinhaCasa"),sum("receitaCasa"),sum("custosDiretos"),sum("resultado"),""]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ws1Data),"Eventos");

  // Sheet 3: Compras
  const ws3Data=[["Produto","Semana","Data","Qtd","Custo Unit","Total","Fornecedor"]];
  S.compras.filter(c=>noMes(c.mes||c.data)).forEach(c=>{
    const p=S.produtos.find(x=>x.id===c.produto_id);
    ws3Data.push([p?p.nome:c.produto_id,c.sem||"",c.data||"",c.qtd||0,c.custo_unit||0,c.total||0,c.forn||""]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ws3Data),"Compras");

  // Sheet 4: Estoque
  const ws4Data=[["Produto","Categoria","Unidade","Estoque Teórico","Custo Unit","Valor Estoque","Mínimo","Status"]];
  S.produtos.forEach(p=>{
    const at=estoqueAtual(p.id);
    const alr=(p.estoque_min||0)>0&&at<(p.estoque_min||0);
    ws4Data.push([p.nome,p.categoria||"",p.unidade||"",+at.toFixed(2),p.preco_compra||0,+(at*(p.preco_compra||0)).toFixed(2),p.estoque_min||0,alr?"ABAIXO":"OK"]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ws4Data),"Estoque");

  XLSX.writeFile(wb,"Mahau_Fechamento_"+new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")+".xlsx");
}

  const COMBOS = [
    // ── COMBOS + RED BULL ──────────────────────────────────────────────────────
    {nome:"Combo Gin Bombay + Red Bull",      cat:"Combos", venda:780,  gin:"Garrafa Bombay 750ml"},

    {nome:"Combo JW Black Label + Red Bull",  cat:"Combos", venda:970,  gin:"JW Black Label"},
    {nome:"Combo JW Gold Label + Red Bull",   cat:"Combos", venda:1210, gin:"JW Gold Label"},
    {nome:"Combo JW Blue Label + Red Bull",   cat:"Combos", venda:3300, gin:"JW Blue Label"},
    {nome:"Combo Royal Salute + Red Bull",    cat:"Combos", venda:3300, gin:"Royal Salute 21 anos"},
    {nome:"Combo Woodford Reserve + Red Bull",cat:"Combos", venda:1100, gin:"Woodford Reserve"},
    {nome:"Combo Gentleman Jack + Red Bull",  cat:"Combos", venda:1100, gin:"Gentleman Jack"},
    {nome:"Combo Jack Single Barrel + Red Bull",cat:"Combos",venda:1100,gin:"Jack Daniel\'s Single Barrel"},
    {nome:"Combo Chivas 12 + Red Bull",       cat:"Combos", venda:970,  gin:"Chivas Regal 12 anos"},
    {nome:"Combo Dewar\'s 15 + Red Bull",    cat:"Combos", venda:1210, gin:"Dewar\'s 15"},
    {nome:"Combo Dewar\'s 18 + Red Bull",    cat:"Combos", venda:2110, gin:"Dewar\'s 18"},
    // ── COMBOS + TÔNICA ────────────────────────────────────────────────────────
    {nome:"Combo Gin Bombay + Tônica",        cat:"Combos", venda:725,  gin:"Garrafa Bombay 750ml",    tonica:true},
    {nome:"Combo Star of Bombay + Tônica",    cat:"Combos", venda:915,  gin:"Garrafa Star Of Bombay 750ml", tonica:true},
    {nome:"Combo Hendricks + Tônica",         cat:"Combos", venda:845,  gin:"Garrafa Hendricks 700ml", tonica:true},
    {nome:"Combo Tanqueray Ten + Tônica",     cat:"Combos", venda:915,  gin:"Garrafa Tanqueray Ten 750ml", tonica:true},
  ];

  // Get products from Firestore to match IDs
  const prodSnap = await db.collection("produtos").get();
  const prods = prodSnap.docs.map(d=>d.data());

  function findProd(nome) {
    const nl = nome.toLowerCase();
    return prods.find(p=>
      p.nome.toLowerCase()===nl ||
      p.nome.toLowerCase().includes(nl) ||
      nl.includes(p.nome.toLowerCase())
    );
  }

  const rb   = findProd("Red Bull Energy 250ml") || findProd("Red Bull");
  const ton  = findProd("Schweppes Tônica 200ml") || findProd("Schweppes Tônica");

  let count=0;
  for(const combo of COMBOS){
    const garrafa = findProd(combo.gin);
    if(!garrafa){ console.warn("Garrafa não encontrada:",combo.gin); continue; }

    const mixer = combo.tonica ? ton : rb;
    if(!mixer){ console.warn("Mixer não encontrado"); continue; }

    const ings = [
      {produto_id: garrafa.id, nome_prod: garrafa.nome, quantidade_ml: garrafa.capacidade_ml||750, tipo:"garrafa"},
      {produto_id: mixer.id,   nome_prod: mixer.nome,   quantidade_ml: mixer.capacidade_ml||250,  tipo:"mixer",   qtd_unidades:5},
    ];

    const ts = firebase.firestore.FieldValue.serverTimestamp();
    const fRef = await db.collection("fichas").add(Domain.camposCriacao({
      nome: combo.nome,
      categoria: combo.cat,
      preco_venda: combo.venda,
      tipo_combo: combo.tonica?"tonica":"redbull",
      ingredientes: ings,
      origem: "combo_seed",
    }, ts));
    await fRef.update({id: fRef.id}); // write-back do id (corrige fichas inalcançáveis)
    count++;
  }
  console.log("Combos cadastrados:", count);
}

function descreveDoc(col,d){
  switch(col){
    case "produtos": case "fichas": case "custos": return d.nome||"(sem nome)";
    case "compras":  return `${(S.produtos.find(p=>p.id===d.produto_id)||{}).nome||d.produto_id||"?"} · ${fmtData(d.data)}`;
    case "eventos":  return `${d.nome||"(sem nome)"} · ${fmtData(d.data)}`;
    case "inventarios": return `${d.semana||""} · ${fmtMes(d.mes||"")||d.data||""}`;
    case "inventarios_mensais": return `Mensal · ${fmtMes(d.mes||"")||d.data||""}`;
    case "semanas_conciliacao": return `${fmtData(d.periodo_inicio)} → ${fmtData(d.periodo_fim)}`;
    case "estoques": return `Estoque ${d.tipo||""} · ${fmtData(d.data_contagem)}`;
    case "vendas_zig": return `Saída ${fmtData(d.periodo_inicio)} → ${fmtData(d.periodo_fim)}`;
    case "cortesias_semana": return `Cortesias ${fmtData(d.periodo_inicio)} → ${fmtData(d.periodo_fim)}`;
    case "estornos_semana": return `Estornos ${fmtData(d.periodo_inicio)} → ${fmtData(d.periodo_fim)}`;
    case "conciliacoes": return `Conciliação ${fmtData(d.periodo_inicio)} → ${fmtData(d.periodo_fim)}`;
    case "mapeamento_zig": return `${d.sku_zig||""} · ${d.nome_zig||""}`;
    default: return d.id||"";
  }
}
function renderLixeira(){
  const grupos=LIXEIRA_COLS.map(g=>({...g, itens:(S._trash[g.col]||[])})).filter(g=>g.itens.length);
  const total=grupos.reduce((s,g)=>s+g.itens.length,0);
  const linha=(col,d)=>{
    const desc=descreveDoc(col,d);
    const restore=`restaurarDoc('${col}','${d.id}')`, hard=`confirmarLimpar(()=>FS.hardDel('${col}','${d.id}'))`;
    return `<tr>
      <td class="w6">${desc}</td>
      <td class="r" style="white-space:nowrap">
        <button class="btn bg_ bsm" onclick="${restore}">↩ Restaurar</button>
        <button class="btn bd_ bsm" onclick="${hard}">Excluir definitivamente</button>
      </td>
    </tr>`;
  };
  set("p-lixeira",`
    <div class="eyebrow">RECUPERAÇÃO</div>
    <div class="pg-t">Lixeira</div>
    ${total?grupos.map(g=>`
      <div class="box">
        <div class="bh"><span class="bt">${g.label} · ${g.itens.length}</span></div>
        <div class="tw"><table>
          <thead><tr><th>Item</th><th class="r">Ações</th></tr></thead>
          <tbody>${g.itens.map(d=>linha(g.col,d)).join("")}</tbody>
        </table></div>
      </div>`).join(""):`<div class="box"><div class="empty">Lixeira vazia.</div></div>`}
  `);
}

function importEstoqueFile(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      // Tenta a aba "Produtos" primeiro; senão varre as abas até achar o cabeçalho esperado.
      const ordem=wb.SheetNames.filter(n=>Domain._norm(n)==="produtos").concat(wb.SheetNames);
      let parsed=null;
      for(const n of ordem){
        const m=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,blankrows:false});
        const r=Domain.parseEstoqueRows(m);
        if(!r.erro && r.itens.length){ parsed=r; break; }
      }
      if(!parsed){ toast("Não encontrei a aba de produtos com as colunas esperadas (Produto, Custo...).","err","Import"); return; }
      estoqueImport={ fileName:file.name, itens:Domain.casarEstoque(parsed.itens, S.produtos) };
      renderConciliacao();
    }catch(err){ toast(err.message||"Falha ao ler o arquivo.","err","Import"); }
  };
  reader.readAsArrayBuffer(file);
}

async function salvarEstoqueImport(){
  const sel=S.concilSemanaSel;
  if(!estoqueImport || !sel){ toast("Selecione uma semana e importe um arquivo.","err"); return; }
  const tipo=sv("est-tipo")||"antes";
  const data=sv("est-data")||new Date().toISOString().slice(0,10);
  const produtos=estoqueImport.itens.map(i=>({
    produto_id:i.produto_id, nome:i.nome, estoque_contado:i.estoque_contado,
    medida:i.medida, quantidade_embalagem:i.quantidade_embalagem, custo:i.custo,
    departamento:i.departamento, setor:i.setor, estoque_minimo:i.estoque_minimo
  }));
  // Reaproveita o doc existente do mesmo (semana, tipo) em vez de duplicar.
  const existente=S.estoques.find(e=>e.semana_id===sel && e.tipo===tipo);
  const ok=await FS.save("estoques",{
    id: existente?existente.id:null,
    semana_id:sel, tipo, data_contagem:data, mes:mesDeData(data), produtos
  });
  if(!ok) return;
  estoqueImport=null;
  renderConciliacao();
  toast(`${produtos.length} itens salvos como estoque ${tipo}.`,"ok","Estoque importado");
}

// Cadastra/atualiza o catálogo `produtos` a partir do XLSX importado (upsert por nome,
// em lote). Re-casa contra S.produtos na hora p/ não duplicar em reimports.
async function cadastrarProdutosDoEstoque(){
  if(!estoqueImport){ toast("Importe um arquivo primeiro.","err"); return; }
  if(!db){ toast("Banco indisponível.","err"); return; }
  const itens=Domain.casarEstoque(estoqueImport.itens, S.produtos); // re-match com S.produtos atual
  if(!confirm(`Cadastrar/atualizar ${itens.length} produtos no catálogo a partir deste arquivo?`)) return;
  try{
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    let criados=0, atualizados=0;
    for(let i=0;i<itens.length;i+=400){
      const batch=db.batch();
      itens.slice(i,i+400).forEach(it=>{
        const base={ nome:it.nome, categoria:it.setor||it.departamento||"", unidade:it.medida||"un",
          capacidade_ml:it.quantidade_embalagem||0, preco_compra:it.custo||0, estoque_min:it.estoque_minimo||0 };
        if(it.produto_id){ // existente → atualiza custo/mín/etc., preserva preco_venda e estoque_inicial
          batch.set(db.collection("produtos").doc(String(it.produto_id)), {...base, updatedAt:ts}, {merge:true});
          atualizados++;
        } else { // novo → cria com estoque_inicial = contagem
          const ref=db.collection("produtos").doc();
          batch.set(ref, Domain.camposCriacao({...base, estoque_inicial:it.estoque_contado||0, id:ref.id}, ts));
          criados++;
        }
      });
      await batch.commit();
    }
    toast(`Catálogo: ${criados} criado(s), ${atualizados} atualizado(s).`,"ok","Produtos");
  }catch(e){ toast(FS._msg(e),"err","Falha ao cadastrar produtos"); }
}

function importVendasZigFile(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const N=Domain._norm, toM=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,blankrows:false});
      let mat=null;
      for(const n of wb.SheetNames.filter(n=>N(n).includes("saida")).concat(wb.SheetNames)){ const m=toM(n); if(!Domain.parseSaidaGeral(m).erro){ mat=m; break; } }
      if(!mat){ toast("Não encontrei a aba de Saída Geral (SKU/Produto/Quantidade).","err","Import"); return; }
      vendasZigImport={ fileName:file.name, periodo:Domain.extrairPeriodoZig(mat), itens:Domain.parseSaidaGeral(mat).itens };
      renderConciliacao();
    }catch(err){ toast(err.message||"Falha ao ler o arquivo.","err","Import"); }
  };
  reader.readAsArrayBuffer(file);
}

async function salvarVendasZig(){

  const existente=S.vendas_zig.find(e=>e.semana_id===sel);

}

const novaRegraForm=()=>({produto_id:"",qtd:"",unidade:"un"});
// Captura os campos do form (DOM) de volta para mapaForm antes de qualquer re-render,
// para não perder o que foi digitado ao adicionar/remover linha ou trocar o tipo.
function mapaCap(){
  const f=mapaForm; if(!f) return;
  if(el("mp-sku")) f.sku_zig=sv("mp-sku");
  if(el("mp-nome")) f.nome_zig=sv("mp-nome");
  if(el("mp-preco")) f.preco_zig=nv("mp-preco");
  if(f.tipo==="direto"||f.tipo==="montavel"){
    const arr=[];
    (f.regras_form||[]).forEach((_,i)=>{
      if(el("mp-prod-"+i)) arr.push({produto_id:sv("mp-prod-"+i), qtd:sv("mp-qtd-"+i), unidade:sv("mp-un-"+i)||"un"});
    });
    if(arr.length) f.regras_form=arr;
  } else if(f.tipo==="combo"){
    if(el("mp-mixer")) f.mixer_produto_id=sv("mp-mixer");
    if(el("mp-redbull")) f.redbull_qtd=nv("mp-redbull");
    if(el("mp-garrafa")) f.garrafa_qtd=nv("mp-garrafa");
  }
}
function mapaAddRegra(){ if(!mapaForm) return; mapaCap(); (mapaForm.regras_form=mapaForm.regras_form||[]).push(novaRegraForm()); renderConciliacao(); }
function mapaDelRegra(i){ if(!mapaForm) return; mapaCap(); const a=mapaForm.regras_form||[]; if(a.length<=1) return; a.splice(i,1); renderConciliacao(); }

function novoMapa(sku,nome){ mapaForm={id:null,sku_zig:sku||"",nome_zig:nome||"",tipo:"direto",regras_form:[novaRegraForm()]}; S.concilTab="mapa"; renderConciliacao(); }
function editarMapa(id){
  const m=S.mapeamento_zig.find(x=>x.id===id); if(!m) return;
  const rf=(m.regras||[]).filter(r=>r&&r.produto_id)
    .map(r=>({produto_id:r.produto_id, qtd:(r.quantidade_baixa!=null?String(r.quantidade_baixa):""), unidade:r.unidade||"un"}));
  mapaForm={id:m.id,sku_zig:m.sku_zig,nome_zig:m.nome_zig,tipo:m.tipo||"direto",
    regras_form: rf.length?rf:[novaRegraForm()],
    garrafa_qtd:m.garrafa_qtd,redbull_qtd:m.redbull_qtd,
    preco_zig:m.preco_zig,mixer_produto_id:m.mixer_produto_id};
  renderConciliacao();
}
function salvarMapa(){
  const f=mapaForm; if(!f) return;
  mapaCap();
  const sku=sv("mp-sku").trim(), nome=sv("mp-nome").trim(), tipo=sv("mp-tipo");
  if(!validar([[sku,"Informe o SKU da Zig."],[tipo,"Escolha o tipo."]])) return;
  const doc={id:f.id||null, sku_zig:sku, nome_zig:nome, tipo, ativo:true, regras:[], redbull_qtd:0, garrafa_qtd:0,
    preco_zig:nv("mp-preco")||0, mixer_produto_id:"", mixer_nome:""};
  if(tipo==="direto"||tipo==="montavel"){
    const fonte=tipo==="montavel"?"montavel":"hardcoded";
    const linhas=(f.regras_form||[]).filter(r=>(r.produto_id||"").trim() || String(r.qtd||"").trim());
    if(!validar([[linhas.length>0,"Adicione pelo menos 1 ingrediente que baixa."]])) return;
    const regras=[], vistos=new Set();
    for(const r of linhas){
      const pid=(r.produto_id||"").trim(), qtd=parseFloat(r.qtd), un=r.unidade||"un";
      const p=S.produtos.find(x=>x.id===pid);
      if(!validar([[pid,"Selecione o produto em todas as linhas de ingrediente."],[qtd>0,"A quantidade de baixa deve ser maior que zero em todas as linhas."]])) return;
      if(vistos.has(pid)){ toast("Produto repetido nos ingredientes: "+(p?p.nome:pid)+". Some as quantidades numa linha só.","err","Ingrediente duplicado"); return; }
      vistos.add(pid);
      regras.push({produto_id:pid, nome_produto:p?p.nome:"", quantidade_baixa:qtd, unidade:un, fonte});
    }
    doc.regras=regras;
  } else if(tipo==="combo"){
    const mid=sv("mp-mixer"), mp=S.produtos.find(x=>x.id===mid);
    doc.garrafa_qtd=nv("mp-garrafa"); doc.redbull_qtd=nv("mp-redbull");
    doc.mixer_produto_id=mid||""; doc.mixer_nome=mp?mp.nome:"";
  }
  FS.save("mapeamento_zig",doc);
  mapaForm=null; renderConciliacao();
}

function concilResultadoHTML(){
  const sel=S.concilSemanaSel;
  if(!sel) return `<div class="alert-strip" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25);color:#f59e0b">Selecione uma semana na aba 📆 Semanas para conciliar.</div>`;
  const s=S.semanas_conciliacao.find(x=>x.id===sel)||{};
  const eAntes=S.estoques.find(e=>e.semana_id===sel && e.tipo==="antes");
  const eDepois=S.estoques.find(e=>e.semana_id===sel && e.tipo==="depois");
  const saida=S.vendas_zig.find(e=>e.semana_id===sel);
  const cort=S.cortesias_semana.find(e=>e.semana_id===sel);
  const est=S.estornos_semana.find(e=>e.semana_id===sel);
  const faltando=[];
  if(!eAntes) faltando.push("Estoque ANTES");
  if(!eDepois) faltando.push("Estoque DEPOIS");
  if(!saida) faltando.push("Saída Geral");
  const podeGerar=faltando.length===0;
  const doc=S.conciliacoes.find(c=>c.semana_id===sel);

  let html=`<div class="fb">
    <div class="ft">Conciliação — ${fmtData(s.periodo_inicio)} → ${fmtData(s.periodo_fim)}</div>
    <div style="font-size:11px;color:#484f58;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      ${chip(eAntes?"estoque antes ✓":"sem estoque antes",eAntes?"#22c55e":"#ef4444")}
      ${chip(eDepois?"estoque depois ✓":"sem estoque depois",eDepois?"#22c55e":"#ef4444")}
      ${chip(saida?"saída ✓":"sem saída",saida?"#22c55e":"#ef4444")}
      ${chip(cort?"cortesias ✓":"sem cortesias",cort?"#22c55e":"#6b7280")}
      ${chip(est?"estornos ✓":"sem estornos",est?"#22c55e":"#6b7280")}
    </div>
    ${podeGerar
      ? `<button class="btn bp" onclick="gerarConciliacao()">${doc?"↻ Regerar Conciliação":"⚖️ Gerar Conciliação"}</button>`
      : `<div class="alert-strip" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25);color:#f59e0b">Faltam fontes obrigatórias: <strong>${faltando.join(", ")}</strong>. Importe nas abas anteriores (cortesias e estornos são opcionais).</div>`}
  </div>`;

  if(!doc) return html+(podeGerar?`<div class="alert-strip" style="background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.3);color:#3b82f6">Clique em <strong>Gerar Conciliação</strong> para calcular o desvio por produto.</div>`:"");

  const ct=doc.contagem||{};
  html+=`<div class="kpis">
    ${kpi("Total Falta",R(doc.total_falta||0),(ct.falta||0)+" itens","#ef4444","#ef4444")}
    ${kpi("Total Sobra",R(doc.total_sobra||0),(ct.sobra||0)+" itens","#f59e0b","#f59e0b")}
    ${kpi("Produtos OK",(ct.ok||0)+"","dentro de ±0,5","#22c55e","#22c55e")}
    ${kpi("Sem ficha",(ct.sem_ficha||0)+"","fora do cálculo","#6b7280","#6b7280")}
  </div>`;

  const meta=doc.meta||{}, avisos=[];
  if((meta.skus_nao_mapeados||[]).length) avisos.push(`${meta.skus_nao_mapeados.length} SKU(s) de venda não mapeados`);
  if(meta.cortesias_sem_mapa) avisos.push(`${meta.cortesias_sem_mapa} cortesia(s) sem mapeamento`);
  if(meta.cortesias_sem_preco) avisos.push(`${meta.cortesias_sem_preco} cortesia(s) sem preço Zig`);
  if(meta.estornos_sem_mapa) avisos.push(`${meta.estornos_sem_mapa} estorno(s) sem mapeamento`);
  if(avisos.length) html+=`<div class="alert-strip" style="background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25);color:#f59e0b">⚠ Ficou de fora do cálculo: ${avisos.join(" · ")}.</div>`;

  const filtro=concilResultFiltro||"todos";
  const fbtn=(id,label)=>`<button class="pill${filtro===id?" on":""}" onclick="concilResultFiltro='${id}';renderConciliacao()">${label}</button>`;
  html+=`<div class="fb"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
    <div class="pills">${fbtn("todos","Todos")}${fbtn("falta","Faltas")}${fbtn("sobra","Sobras")}${fbtn("ok","OK")}${fbtn("sem_ficha","Sem ficha")}</div>
    <div style="display:flex;gap:8px">
      <button class="btn bg_ bsm" onclick="copiarConciliacaoWhatsApp()">📋 WhatsApp</button>
      <button class="btn bg_ bsm" onclick="exportarConciliacaoPDF()">🖨️ PDF</button>
    </div>
  </div><div style="font-size:10px;color:#484f58;margin-top:6px">Gerado em ${fmtData((doc.gerado_em||"").slice(0,10))} · ${(doc.resultados||[]).length} produtos contados</div></div>`;

  const tint={ok:"",falta:"background:rgba(239,68,68,.06)",sobra:"background:rgba(245,158,11,.06)",sem_ficha:"background:rgba(107,114,128,.05)"};
  let rows=(doc.resultados||[]).slice();
  if(filtro!=="todos") rows=rows.filter(r=>r.status===filtro);
  html+=`<div class="box">
    <div class="bh"><span class="bt">${rows.length} produto(s)${filtro!=="todos"?` · ${STAT_CONCIL[filtro][0]}`:""}</span></div>
    <div class="tw"><table>
      <thead><tr><th>Produto</th><th class="r">Antes</th><th class="r">Compras</th><th class="r">Venda</th><th class="r">Cortesia</th><th class="r">Estorno</th><th class="r">Esperado</th><th class="r">Real</th><th class="r">Desvio</th><th class="r">R$</th><th>Status</th></tr></thead>
      <tbody>${rows.length?rows.map(r=>`<tr style="${tint[r.status]||""}">
        <td class="w6">${r.nome}</td>
        <td class="r mn">${fmtU(r.antes)}</td><td class="r mn">${fmtU(r.compras)}</td><td class="r mn">${fmtU(r.venda)}</td>
        <td class="r mn">${fmtU(r.cortesia)}</td><td class="r mn">${fmtU(r.estorno)}</td><td class="r mn">${fmtU(r.esperado)}</td>
        <td class="r mn">${fmtU(r.real)}</td>
        <td class="r mn" style="color:${r.desvio<0?"#ef4444":r.desvio>0?"#f59e0b":"#8b949e"}">${r.desvio>0?"+":""}${fmtU(r.desvio)}</td>
        <td class="r mn">${r.valor_rs?R(r.valor_rs):"—"}</td>
        <td>${chip(STAT_CONCIL[r.status][0],STAT_CONCIL[r.status][1])}</td>
      </tr>`).join(""):`<tr><td colspan="11" class="empty">Nenhum produto neste filtro.</td></tr>`}</tbody>
    </table></div>
  </div>`;
  return html;
}

async function gerarConciliacao(){
  const sel=S.concilSemanaSel;
  if(!sel){ toast("Selecione uma semana.","err"); return; }
  const s=S.semanas_conciliacao.find(x=>x.id===sel)||{};
  const eAntes=S.estoques.find(e=>e.semana_id===sel && e.tipo==="antes");
  const eDepois=S.estoques.find(e=>e.semana_id===sel && e.tipo==="depois");
  const saida=S.vendas_zig.find(e=>e.semana_id===sel);
  if(!eAntes||!eDepois||!saida){ toast("Faltam fontes obrigatórias (estoque antes/depois e saída).","err"); return; }
  const cort=S.cortesias_semana.find(e=>e.semana_id===sel);
  const est=S.estornos_semana.find(e=>e.semana_id===sel);
  const r=Domain.conciliar({
    estoqueAntes:eAntes.produtos||[], estoqueDepois:eDepois.produtos||[],
    saidaGeral:saida.itens||[], cortesias:(cort&&cort.itens)||[], estornos:(est&&est.itens)||[],
    compras:S.compras, mapeamentos:S.mapeamento_zig, produtos:S.produtos,
    opts:{periodo_inicio:s.periodo_inicio, periodo_fim:s.periodo_fim}
  });
  const existente=S.conciliacoes.find(c=>c.semana_id===sel);
  const ok=await FS.save("conciliacoes",{
    id: existente?existente.id:null, semana_id:sel,
    periodo_inicio:s.periodo_inicio||"", periodo_fim:s.periodo_fim||"", mes:mesDeData(s.periodo_inicio||""),
    gerado_em:new Date().toISOString(),
    resultados:r.resultados, total_falta:r.total_falta, total_sobra:r.total_sobra,
    contagem:r.contagem, meta:r.meta
  });
  if(!ok) return;
  renderConciliacao();
  toast(`Conciliação gerada: ${r.contagem.falta} falta(s), ${r.contagem.sobra} sobra(s).`,"ok","Conciliação");
}

function copiarConciliacaoWhatsApp(){
  const sel=S.concilSemanaSel, doc=S.conciliacoes.find(c=>c.semana_id===sel);
  if(!doc){ toast("Gere a conciliação primeiro.","err"); return; }
  const ct=doc.contagem||{};
  const faltas=(doc.resultados||[]).filter(r=>r.status==="falta").slice(0,12);
  const sobras=(doc.resultados||[]).filter(r=>r.status==="sobra").slice(0,8);
  let t=`⚖️ *Conciliação de Estoque*\nSemana: ${fmtData(doc.periodo_inicio)} → ${fmtData(doc.periodo_fim)}\n\n`;
  t+=`🔴 Faltas: ${R(doc.total_falta||0)} (${ct.falta||0} itens)\n`;
  t+=`🟡 Sobras: ${R(doc.total_sobra||0)} (${ct.sobra||0} itens)\n`;
  t+=`🟢 OK: ${ct.ok||0}  ⚪ Sem ficha: ${ct.sem_ficha||0}\n`;
  if(faltas.length){ t+=`\n*Maiores faltas:*\n`; faltas.forEach(r=>{ t+=`• ${r.nome}: ${fmtU(r.desvio)} un (${R(r.valor_rs)})\n`; }); }
  if(sobras.length){ t+=`\n*Maiores sobras:*\n`; sobras.forEach(r=>{ t+=`• ${r.nome}: +${fmtU(r.desvio)} un (${R(r.valor_rs)})\n`; }); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("Resumo copiado — cole no WhatsApp.","ok","WhatsApp")).catch(()=>toast("Não consegui copiar para a área de transferência.","err"));
  } else { toast("Área de transferência indisponível neste navegador.","err"); }
}

function exportarConciliacaoPDF(){
  const sel=S.concilSemanaSel, doc=S.conciliacoes.find(c=>c.semana_id===sel);
  if(!doc){ toast("Gere a conciliação primeiro.","err"); return; }
  const ct=doc.contagem||{};
  const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const rows=(doc.resultados||[]).filter(r=>r.status!=="ok"); // PDF foca no acionável
  const trs=rows.map(r=>`<tr class="${r.status}"><td>${esc(r.nome)}</td><td class=n>${fmtU(r.antes)}</td><td class=n>${fmtU(r.compras)}</td><td class=n>${fmtU(r.venda)}</td><td class=n>${fmtU(r.cortesia)}</td><td class=n>${fmtU(r.estorno)}</td><td class=n>${fmtU(r.esperado)}</td><td class=n>${fmtU(r.real)}</td><td class=n>${r.desvio>0?"+":""}${fmtU(r.desvio)}</td><td class=n>${r.valor_rs?R(r.valor_rs):"—"}</td><td>${STAT_CONCIL[r.status][0]}</td></tr>`).join("");
  const win=window.open("","_blank");
  if(!win){ toast("Permita pop-ups para exportar o PDF.","err"); return; }
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Conciliacao ${fmtData(doc.periodo_inicio)}</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px}h1{font-size:18px;margin:0 0 2px}.sub{color:#666;font-size:12px;margin-bottom:14px}
  .cards{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.card{border:1px solid #ddd;border-radius:6px;padding:8px 12px;font-size:12px}.card b{display:block;font-size:16px}
  table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #ddd;padding:4px 6px;text-align:left}td.n,th.n{text-align:right}
  tr.falta td{background:#fdecec}tr.sobra td{background:#fff6e6}tr.sem_ficha td{background:#f2f2f2;color:#666}
  @media print{body{margin:0}}</style></head><body>
  <h1>Conciliacao de Estoque</h1>
  <div class="sub">Semana ${fmtData(doc.periodo_inicio)} &rarr; ${fmtData(doc.periodo_fim)} · gerado em ${fmtData((doc.gerado_em||"").slice(0,10))}</div>
  <div class="cards">
    <div class="card">Total Falta<b style="color:#c0392b">${R(doc.total_falta||0)}</b>${ct.falta||0} itens</div>
    <div class="card">Total Sobra<b style="color:#b9770e">${R(doc.total_sobra||0)}</b>${ct.sobra||0} itens</div>
    <div class="card">Produtos OK<b style="color:#1e7e34">${ct.ok||0}</b></div>
    <div class="card">Sem ficha<b style="color:#666">${ct.sem_ficha||0}</b></div>
  </div>
  <table><thead><tr><th>Produto</th><th class=n>Antes</th><th class=n>Compras</th><th class=n>Venda</th><th class=n>Cortesia</th><th class=n>Estorno</th><th class=n>Esperado</th><th class=n>Real</th><th class=n>Desvio</th><th class=n>R$</th><th>Status</th></tr></thead>
  <tbody>${trs||`<tr><td colspan="11">Sem divergencias (tudo OK).</td></tr>`}</tbody></table>
  <p style="color:#999;font-size:10px;margin-top:14px">Mostrando apenas faltas, sobras e sem-ficha. Produtos OK omitidos. Total contado: ${(doc.resultados||[]).length}.</p>
  </body></html>`);
  win.document.close();
  setTimeout(()=>{ try{ win.focus(); win.print(); }catch(_){} },300);
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
let _unsubs = [];

// Anexa os listeners do Firestore. Idempotente: não duplica se já vinculado.
function bindData(){
  if(_unsubs.length || !db) return;
  // Filtra soft-deletados ao entrar (ficam só na Lixeira via S._trash); invalida o
  // índice de estoque para as coleções que o alimentam.
  const COLS=["produtos","fichas","compras","eventos","custos","inventarios","inventarios_mensais","semanas_conciliacao","estoques","vendas_zig","mapeamento_zig","cortesias_semana","estornos_semana","conciliacoes"];
  const STOCK=new Set(["produtos","compras","inventarios","inventarios_mensais","eventos"]);
  COLS.forEach(col=>{
    _unsubs.push(FS.listen(col, d=>{
      S[col]=d.filter(x=>!x.deletedAt);
      S._trash[col]=d.filter(x=>x.deletedAt);
      if(STOCK.has(col)) _estoqueIdx=null;
      scheduleRender();
    }));
  });
  _unsubs.push(db.collection("config").doc("settings").onSnapshot(
    s=>{ if(s.exists)S.config=s.data();scheduleRender(); },
    e=>toast(FS._msg(e),"err","Falha ao carregar config")));
  // Produtos são cadastrados manualmente via botão na página Produtos
}

// Cancela os listeners e limpa o estado — evita erros de permissão após logout.
function unbindData(){
  _unsubs.forEach(u=>{ try{ u&&u(); }catch(_){} });
  _unsubs=[];
  S.produtos=[];S.fichas=[];S.compras=[];S.eventos=[];
  S.custos=[];S.inventarios=[];S.inventarios_mensais=[];
  S.semanas_conciliacao=[];S.estoques=[];S.vendas_zig=[];S.mapeamento_zig=[];S.cortesias_semana=[];S.estornos_semana=[];S.conciliacoes=[];S._trash={};
}

function showLogin(){
  el("login-screen")?.classList.remove("hidden");
  const b=el("login-btn"); if(b){ b.disabled=false; b.textContent="Entrar"; }
  setTimeout(()=>el("login-email")?.focus(),50);
}

function showApp(user){
  el("login-screen")?.classList.add("hidden");
  const box=el("sb-auth");
  if(box) box.innerHTML=`<span class="sb-auth-email" title="${user.email||""}">${user.email||"Logado"}</span>
    <button class="sb-logout" onclick="doLogout()">Sair</button>`;
  render();
}

function doLogin(e){
  if(e) e.preventDefault();
  if(!auth){ toast("Autenticação indisponível.","err"); return; }
  const email=el("login-email").value.trim();
  const pass =el("login-pass").value;
  const errEl=el("login-err"); errEl.textContent="";
  if(!email||!pass){ errEl.textContent="Preencha e-mail e senha."; return; }
  const btn=el("login-btn"); btn.disabled=true; btn.textContent="Entrando...";
  // onAuthStateChanged cuida de mostrar o app em caso de sucesso.
  auth.signInWithEmailAndPassword(email,pass).catch(err=>{
    errEl.textContent=loginErrMsg(err);
    btn.disabled=false; btn.textContent="Entrar";
  });
}

function doLogout(){
  if(!auth) return;
  if(confirm("Sair do sistema?")) auth.signOut().then(()=>{ const p=el("login-pass"); if(p)p.value=""; });
}

function loginErrMsg(err){
  switch(err&&err.code){
    case "auth/invalid-email":          return "E-mail inválido.";
    case "auth/user-disabled":          return "Usuário desativado.";
    case "auth/user-not-found":
    case "auth/wrong-password":
    case "auth/invalid-credential":     return "E-mail ou senha incorretos.";
    case "auth/too-many-requests":      return "Muitas tentativas. Aguarde e tente de novo.";
    case "auth/network-request-failed": return "Falha de conexão.";
    case "auth/unauthorized-domain":    return "Domínio não autorizado (Authentication → Settings → Authorized domains).";
    case "auth/operation-not-allowed":  return "Login por e-mail/senha não habilitado no Firebase.";
    default: return (err&&err.message)||"Falha ao entrar.";
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  initNav();render();
  if(auth){
    auth.onAuthStateChanged(user=>{
      if(user){ bindData(); showApp(user); }
      else    { unbindData(); showLogin(); }
    });
  } else {
    // Firebase/Auth indisponível — modo degradado, sem login (comportamento anterior)
    el("login-screen")?.classList.add("hidden");
    bindData();
  }
}
init();
</script>
